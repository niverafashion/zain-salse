<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta property="og:type" content="website">
<meta property="og:title"
      content="Zain Sales | إدارة المبيعات">
<meta property="og:description"
      content="نظام إدارة مبيعات الخطوط والديون والإحصائيات">

<meta property="og:image"
      content="https://niverafashion.github.io/zain-salse/zain-sales/assets/images/social-preview.png">

<meta name="twitter:card"
      content="summary_large_image">


<link rel="manifest" href="./manifest.webmanifest">

<meta name="theme-color" content="#7139b7">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="Zain Sales">

<link rel="apple-touch-icon"
      href="./assets/icons/apple-touch-icon.png">


  <meta charset="UTF-8">

  <meta name="viewport"

        content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | Zain Sales</title>

  <link rel="preconnect"

        href="https://fonts.googleapis.com">

  <link rel="preconnect"

        href="https://fonts.gstatic.com"

        crossorigin>

  <link

    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"

    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">

  <main class="login-card">

    <div class="logo">Z</div>

    <h1>Zain Sales</h1>

    <p class="subtitle">

      نظام إدارة مبيعات خطوط زين

    </p>

    <form id="loginForm">

      <div class="form-group">

        <label for="email">البريد الإلكتروني</label>

        <input

          type="email"

          id="email"

          placeholder="أدخل بريدك الإلكتروني"

          autocomplete="username"

          required>

      </div>

<div class="form-group">

  <label for="password">كلمة المرور</label>

  <input
    type="password"
    id="password"
    placeholder="أدخل كلمة المرور"
    autocomplete="current-password"
    required>

  <div class="forgot-password">
    <a href="forgot-password.html">نسيت كلمة المرور؟</a>
  </div>

</div>

      <p id="errorMessage"

         class="error-message"

         role="alert"

         aria-live="polite"></p>

      <button type="submit" id="loginBtn">

        تسجيل الدخول

      </button>
<div class="signup-link">
  <span>ليس لديك حساب ؟</span>
  <a href="signup.html">إنشاء حساب جديد</a>
</div>
    </form>
<button id="installAppBtn"
        type="button"
        hidden>
  تثبيت Zain Sales
</button>
    <p class="footer-text">

      نظام إدارة المبيعات

    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script src="js/config.js"></script>

  <script src="js/auth.js"></script>

  <script>

    const form = document.getElementById("loginForm");

    const btn = document.getElementById("loginBtn");

    const errorBox =

      document.getElementById("errorMessage");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      errorBox.textContent = "";

      btn.disabled = true;

      btn.textContent = "جاري تسجيل الدخول...";

      try {

        await login(

          document.getElementById("email").value.trim(),

          document.getElementById("password").value

        );

      } catch (error) {

        errorBox.textContent = error.message;

        btn.disabled = false;

        btn.textContent = "تسجيل الدخول";

      }

    });

    // Skip login when a valid session exists.

    supabaseClient.auth.getUser().then(

      ({ data, error }) => {

        if (!error && data.user) {

          window.location.replace("dashboard.html");

        }

      }

    );

  </script>
<script src="js/pwa.js"></script>
</body>

</html>
