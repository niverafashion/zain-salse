<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>لا يوجد اتصال | Zain Sales</title>
  <meta name="theme-color" content="#7139b7">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
      background: #f7f3fc;
      color: #262032;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 22px;
      box-shadow: 0 12px 35px #7139b712;
    }

    img {
      width: 100px;
      height: 100px;
      border-radius: 22px;
    }

    h1 { font-size: 23px; }

    p {
      color: #827b8c;
      line-height: 1.9;
    }

    button {
      background: #7139b7;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 13px 25px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="./assets/icons/icon-192.png"
         alt="Zain Sales">

    <h1>ماكو اتصال بالإنترنت</h1>

    <p>
      تأكد من اتصالك بالإنترنت
      حتى تكدر تعرض المبيعات
      وتسجل العمليات الجديدة.
    </p>

    <button onclick="location.reload()">
      إعادة المحاولة
    </button>
  </div>
</body>
</html>
