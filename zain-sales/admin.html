<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>لوحة الإدارة | Zain Sales</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* =====================================================
       Zain Sales - Admin Dashboard
       ===================================================== */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background:
        radial-gradient(
          circle at top right,
          #f0e8ff 0,
          #f6f5fb 35%,
          #f6f5fb 100%
        );
      color: #292633;
      font-family: Arial, sans-serif;
    }
    button {
      font-family: inherit;
    }
    /* =====================================================
       الحاوية
       ===================================================== */
    .admin-container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 25px 18px 45px;
    }
    /* =====================================================
       الهيدر
       ===================================================== */
    .admin-header {
      position: relative;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #ebe5f5;
      border-radius: 26px;
      padding: 24px 26px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow:
        0 12px 35px rgba(80, 50, 120, 0.08);
      overflow: hidden;
    }
    .admin-header::before {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      left: -55px;
      top: -60px;
      background: #f0e6ff;
      border-radius: 50%;
    }
    .admin-header-content {
      position: relative;
      z-index: 1;
    }
    .admin-header h1 {
      margin: 0 0 7px;
      color: #5b21b6;
      font-size: 26px;
      font-weight: 800;
    }
    .admin-header p {
      margin: 0;
      color: #8a8391;
      font-size: 14px;
    }
    /* =====================================================
       تسجيل الخروج
       ===================================================== */
    .logout-btn {
      position: relative;
      z-index: 2;
      border: 1px solid #e6d8fa;
      background: #f8f3ff;
      color: #6d28d9;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 13px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition:
        background 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;
    }
    .logout-btn:hover {
      background: #eee3ff;
      box-shadow:
        0 5px 15px rgba(109, 40, 217, 0.08);
    }
    .logout-btn:active {
      transform: scale(0.97);
    }
    /* =====================================================
       الرسائل
       ===================================================== */
    .message {
      display: none;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 18px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.7;
    }
    .message.show {
      display: block;
    }
    .message.error {
      background: #fff0f0;
      border: 1px solid #ffd4d4;
      color: #b42318;
    }
    .message.success {
      background: #effbf3;
      border: 1px solid #ccefd7;
      color: #187a3d;
    }
    .message.warning {
      background: #fff9e8;
      border: 1px solid #f8e5a9;
      color: #8a6500;
    }
    /* =====================================================
       الإحصائيات
       ===================================================== */
    .stats-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 22px;
    }
    .stat-card {
      position: relative;
      background: #ffffff;
      border: 1px solid #eeeaf5;
      border-radius: 21px;
      padding: 20px;
      min-height: 120px;
      overflow: hidden;
      box-shadow:
        0 8px 27px rgba(80, 50, 120, 0.055);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 30px rgba(80, 50, 120, 0.09);
    }
    .stat-card::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      left: -28px;
      bottom: -28px;
      background: #f4edff;
      border-radius: 50%;
    }
    .stat-card span {
      display: block;
      margin-bottom: 10px;
      color: #817b89;
      font-size: 13px;
      font-weight: 600;
    }
    .stat-card strong {
      display: block;
      position: relative;
      z-index: 1;
      color: #5b21b6;
      font-size: 29px;
      font-weight: 800;
      line-height: 1.2;
    }
    /* =====================================================
       قسم الطلبات
       ===================================================== */
    .requests-section {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #eeeaf5;
      border-radius: 26px;
      padding: 22px;
      box-shadow:
        0 10px 35px rgba(80, 50, 120, 0.055);
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }
    .section-title {
      margin: 0;
      color: #302b38;
      font-size: 21px;
      font-weight: 800;
    }
    .section-subtitle {
      margin: 5px 0 0;
      color: #918b98;
      font-size: 12px;
    }
    /* =====================================================
       الطلبات
       ===================================================== */
    #requestsContainer {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .loading {
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #88818f;
      font-size: 14px;
    }
    .empty-state {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #918b98;
      font-size: 14px;
      background: #faf9fc;
      border: 1px dashed #ddd4e8;
      border-radius: 18px;
    }
    .empty-state-icon {
      font-size: 34px;
      margin-bottom: 10px;
      opacity: 0.7;
    }
    /* =====================================================
       كرت الطلب
       ===================================================== */
    .request-card {
      position: relative;
      background: #ffffff;
      border: 1px solid #ebe7f1;
      border-radius: 21px;
      padding: 20px;
      overflow: hidden;
      box-shadow:
        0 5px 20px rgba(80, 50, 120, 0.035);
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }
    .request-card:hover {
      transform: translateY(-2px);
      border-color: #dacbed;
      box-shadow:
        0 12px 30px rgba(80, 50, 120, 0.08);
    }
    /* خط جانبي للطلب */
    .request-card.pending {
      border-right: 4px solid #7c3aed;
    }
    .request-card.approved {
      border-right: 4px solid #16a34a;
    }
    .request-card.rejected {
      border-right: 4px solid #dc2626;
    }
    /* =====================================================
       أعلى الكرت
       ===================================================== */
    .request-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 17px;
      margin-bottom: 17px;
      border-bottom: 1px solid #f0edf4;
    }
    .request-user-area {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* أيقونة المندوب */
    .request-avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #ede1ff,
          #f7f2ff
        );
      border: 1px solid #e5d7fa;
      border-radius: 15px;
      color: #6d28d9;
      font-size: 21px;
      font-weight: 800;
    }
    .request-user-info {
      min-width: 0;
    }
    .request-user {
      color: #292532;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.4;
      word-break: break-word;
    }
    .request-email {
      margin-top: 5px;
      color: #918b98;
      font-size: 12px;
      direction: ltr;
      text-align: right;
      word-break: break-all;
    }
    /* =====================================================
       الحالة
       ===================================================== */
    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 31px;
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-pending {
      background: #fff8df;
      border: 1px solid #f2dfa4;
      color: #876400;
    }
    .status-approved {
      background: #effbf3;
      border: 1px solid #ccefd7;
      color: #187a3d;
    }
    .status-rejected {
      background: #fff0f0;
      border: 1px solid #ffd3d3;
      color: #b42318;
    }
    /* =====================================================
       معلومات الطلب
       ===================================================== */
    .request-info {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .info-box {
      background: #faf9fc;
      border: 1px solid #f0edf4;
      border-radius: 14px;
      padding: 13px 14px;
      min-width: 0;
    }
    .info-box span {
      display: block;
      margin-bottom: 7px;
      color: #938d9b;
      font-size: 11px;
      font-weight: 600;
    }
    .info-box strong {
      display: block;
      color: #393341;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.5;
      word-break: break-word;
    }
    .info-box.price-box {
      background: #f8f2ff;
      border-color: #e8daf8;
    }
    .info-box.price-box strong {
      color: #6d28d9;
      font-size: 15px;
    }
    /* =====================================================
       تفاصيل إضافية
       ===================================================== */
    .request-extra {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }
    .extra-box {
      background: #fcfbfd;
      border: 1px solid #f0edf4;
      border-radius: 14px;
      padding: 12px 14px;
      min-width: 0;
    }
    .extra-box span {
      display: block;
      color: #938d9b;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .extra-box strong {
      display: block;
      color: #4a4551;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }
    .payment-reference {
      direction: ltr;
      text-align: right;
      font-family: monospace;
      color: #5b21b6 !important;
    }
    /* =====================================================
       الملاحظات
       ===================================================== */
    .request-notes {
      background: #f8f6fc;
      border: 1px solid #ece6f7;
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 16px;
      color: #625c69;
      font-size: 13px;
      line-height: 1.7;
    }
    .request-notes-title {
      display: block;
      margin-bottom: 4px;
      color: #5b21b6;
      font-size: 12px;
      font-weight: 800;
    }
    /* =====================================================
       الأزرار
       ===================================================== */
    .request-actions {
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 10px;
      padding-top: 2px;
    }
    .action-btn {
      border: none;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 13px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition:
        transform 0.15s ease,
        opacity 0.2s ease,
        box-shadow 0.2s ease;
    }
    .action-btn:hover {
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.09);
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .action-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }
    .approve-btn {
      background: #16a34a;
      color: #ffffff;
    }
    .approve-btn:hover {
      background: #15803d;
    }
    .reject-btn {
      background: #fff0f0;
      border: 1px solid #ffd3d3;
      color: #c62828;
    }
    .reject-btn:hover {
      background: #ffe3e3;
    }
    /* =====================================================
       موبايل
       ===================================================== */
    @media (max-width: 850px) {
      .request-info {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 700px) {
      .admin-container {
        padding: 12px 10px 30px;
      }
      .admin-header {
        border-radius: 20px;
        padding: 18px;
        align-items: flex-start;
        flex-direction: column;
      }
      .admin-header h1 {
        font-size: 22px;
      }
      .logout-btn {
        width: 100%;
      }
      .stats-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .stat-card {
        min-height: 95px;
        padding: 17px;
        border-radius: 18px;
      }
      .stat-card strong {
        font-size: 25px;
      }
      .requests-section {
        padding: 15px;
        border-radius: 20px;
      }
      .section-title {
        font-size: 18px;
      }
      .request-card {
        padding: 15px;
        border-radius: 17px;
      }
      .request-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }
      .request-user-area {
        width: 100%;
      }
      .status-badge {
        font-size: 11px;
      }
      .request-info {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .request-extra {
        grid-template-columns: 1fr;
      }
      .info-box {
        padding: 11px;
      }
      .info-box strong {
        font-size: 12px;
      }
      .request-actions {
        grid-template-columns: 1fr;
      }
      .action-btn {
        width: 100%;
      }
    }
    @media (max-width: 380px) {
      .request-info {
        grid-template-columns: 1fr;
      }
      .admin-container {
        padding-left: 8px;
        padding-right: 8px;
      }
      .request-avatar {
        width: 43px;
        height: 43px;
        flex-basis: 43px;
      }
      /* =====================================================
   أدوات البحث والفلترة
   ===================================================== */
.requests-tools {
  margin-bottom: 18px;
}
/* =========================
   البحث
========================== */
.search-box {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
}
.search-box input {
  width: 100%;
  min-height: 48px;
  padding: 0 45px 0 15px;
  background: #faf9fc;
  border: 1px solid #e8e3ef;
  border-radius: 14px;
  outline: none;
  color: #302b38;
  font-family: inherit;
  font-size: 13px;
  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}
.search-box input::placeholder {
  color: #a09aa7;
}
.search-box input:focus {
  background: #ffffff;
  border-color: #b994e8;
  box-shadow:
    0 0 0 4px rgba(109, 40, 217, 0.07);
}
.search-icon {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  pointer-events: none;
  opacity: 0.7;
}
/* =========================
   أزرار الفلترة
========================== */
.filter-tabs {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.filter-tabs::-webkit-scrollbar {
  display: none;
}
.filter-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 40px;
  padding: 0 13px;
  border-radius: 12px;
  border: 1px solid #e7e1ef;
  background: #ffffff;
  color: #696270;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition:
    background 0.2s ease,
    color 0.2s ease,
    border-color 0.2s ease,
    transform 0.15s ease;
}
.filter-btn:hover {
  background: #f8f3ff;
  border-color: #d8c8ed;
  color: #6d28d9;
}
.filter-btn:active {
  transform: scale(0.97);
}
/* الفلتر المختار */
.filter-btn.active {
  background: #6d28d9;
  border-color: #6d28d9;
  color: #ffffff;
}
/* العدد داخل الفلتر */
.filter-btn span {
  min-width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
  border-radius: 20px;
  background: #f2edf8;
  color: #6d28d9;
  font-size: 11px;
  font-weight: 800;
}
.filter-btn.active span {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
}
/* =========================
   لا توجد نتائج للفلتر
========================== */
.filter-empty {
  min-height: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #faf9fc;
  border: 1px dashed #ddd4e8;
  border-radius: 17px;
  color: #918b98;
  font-size: 13px;
}
.filter-empty-icon {
  margin-bottom: 9px;
  font-size: 28px;
}
/* =========================
   موبايل
========================== */
@media (max-width: 700px) {
  .filter-tabs {
    gap: 6px;
  }
  .filter-btn {
    min-height: 38px;
    padding: 0 11px;
    font-size: 11px;
  }
  .search-box input {
    min-height: 46px;
    font-size: 12px;
  }
}
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- =========================
         Header
    ========================== -->
    <header class="admin-header">
      <div class="admin-header-content">
        <h1>
          لوحة الإدارة
        </h1>
        <p>
          إدارة اشتراكات Zain Sales
        </p>
      </div>
      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
      >
        تسجيل الخروج
      </button>
    </header>
    <!-- =========================
         Message
    ========================== -->
    <div
      id="adminMessage"
      class="message"
    ></div>
    <!-- =========================
         Statistics
    ========================== -->
    <section class="stats-grid">
      <div class="stat-card">
        <span>
          طلبات قيد المراجعة
        </span>
        <strong id="pendingCount">
          0
        </strong>
      </div>
      <div class="stat-card">
        <span>
          إجمالي الطلبات
        </span>
        <strong id="totalCount">
          0
        </strong>
      </div>
      <div class="stat-card">
        <span>
          المبلغ قيد المراجعة
        </span>
        <strong id="pendingAmount">
          0 د.ع
        </strong>
      </div>
    </section>
    <!-- =========================
         Requests
    ========================== -->
    <section class="requests-section">
<div class="section-header">

  <div>
    <h2 class="section-title">
      طلبات الاشتراك
    </h2>

    <p class="section-subtitle">
      راجع بيانات الدفع ثم وافق أو ارفض الطلب
    </p>
  </div>

</div>


<!-- =========================
     أدوات البحث والفلترة
========================== -->

<div class="requests-tools">

  <!-- البحث -->
  <div class="search-box">

    <span class="search-icon">
      🔎
    </span>

    <input
      id="requestSearch"
      type="search"
      placeholder="ابحث باسم المندوب أو الإيميل أو رقم العملية..."
      autocomplete="off"
    >

  </div>


  <!-- الفلاتر -->
  <div class="filter-tabs">

    <button
      type="button"
      class="filter-btn active"
      data-filter="all"
    >
      الكل
      <span id="filterAllCount">0</span>
    </button>


    <button
      type="button"
      class="filter-btn"
      data-filter="pending"
    >
      قيد المراجعة
      <span id="filterPendingCount">0</span>
    </button>


    <button
      type="button"
      class="filter-btn"
      data-filter="approved"
    >
      تمت الموافقة
      <span id="filterApprovedCount">0</span>
    </button>


    <button
      type="button"
      class="filter-btn"
      data-filter="rejected"
    >
      مرفوض
      <span id="filterRejectedCount">0</span>
    </button>

  </div>

</div>
      <div
        id="requestsContainer"
        class="loading"
      >
        جاري تحميل الطلبات...
      </div>
    </section>
  </div>
  <!-- =========================
       Scripts
  ========================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
