<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>لوحة الإدارة | Zain Sales</title>

  <meta
    name="theme-color"
    content="#7139b7"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Zain Sales"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    /* =====================================================
       Zain Sales
       Admin Dashboard
       Final UI
       ===================================================== */

    :root {
      --admin-primary: #7139b7;
      --admin-primary-dark: #5b21b6;
      --admin-primary-soft: #f3ebff;

      --admin-bg: #f6f4fa;
      --admin-card: #ffffff;

      --admin-text: #292433;
      --admin-text-soft: #746d7e;
      --admin-text-muted: #9b94a4;

      --admin-border: #ebe6f2;

      --admin-success: #16a34a;
      --admin-success-bg: #effbf3;
      --admin-success-border: #ccefd7;

      --admin-danger: #dc2626;
      --admin-danger-bg: #fff1f1;
      --admin-danger-border: #ffd3d3;

      --admin-warning: #a16207;
      --admin-warning-bg: #fff9e8;
      --admin-warning-border: #f2dfa4;

      --admin-shadow:
        0 10px 35px rgba(80, 50, 120, 0.055);

      --admin-shadow-hover:
        0 15px 38px rgba(80, 50, 120, 0.095);

      --admin-radius-xl: 26px;
      --admin-radius-lg: 21px;
      --admin-radius-md: 15px;
      --admin-radius-sm: 12px;
    }


    /* =====================================================
       Reset
       ===================================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html {
      min-height: 100%;
      background: var(--admin-bg);
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 100% 0%,
          #eee3ff 0,
          rgba(238, 227, 255, 0.42) 17%,
          rgba(246, 244, 250, 0) 39%
        ),
        radial-gradient(
          circle at 0% 100%,
          #f2ebff 0,
          rgba(242, 235, 255, 0.22) 18%,
          rgba(246, 244, 250, 0) 38%
        ),
        var(--admin-bg);

      color: var(--admin-text);

      font-family:
        "Cairo",
        "Tajawal",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    button,
    input {
      font: inherit;
    }


    button {
      -webkit-appearance: none;
      appearance: none;
    }


    /* =====================================================
       الصفحة
       ===================================================== */

    .admin-page {
      width: 100%;
      min-height: 100vh;
    }


    .admin-container {
      width: 100%;
      max-width: 1180px;

      margin: 0 auto;

      padding:
        max(18px, env(safe-area-inset-top))
        18px
        max(42px, env(safe-area-inset-bottom))
        18px;
    }


    /* =====================================================
       Header
       ===================================================== */

    .admin-header {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      min-height: 118px;

      padding: 24px 26px;

      margin-bottom: 20px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.98),
          rgba(250, 247, 255, 0.98)
        );

      border: 1px solid var(--admin-border);

      border-radius: var(--admin-radius-xl);

      box-shadow: var(--admin-shadow);
    }


    .admin-header::before {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      left: -80px;
      top: -105px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(113, 57, 183, 0.13),
          rgba(113, 57, 183, 0)
        );

      pointer-events: none;
    }


    .admin-header::after {
      content: "";

      position: absolute;

      width: 110px;
      height: 110px;

      right: 42%;

      bottom: -80px;

      border-radius: 50%;

      background:
        rgba(113, 57, 183, 0.035);

      pointer-events: none;
    }


    .admin-header-content {
      position: relative;
      z-index: 2;

      min-width: 0;
    }


    .admin-title-row {
      display: flex;
      align-items: center;

      gap: 11px;

      margin-bottom: 7px;
    }


    .admin-title-icon {
      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #7139b7,
          #8b5bd1
        );

      color: #ffffff;

      font-size: 19px;

      box-shadow:
        0 8px 20px rgba(113, 57, 183, 0.22);
    }


    .admin-header h1 {
      margin: 0;

      color: var(--admin-primary-dark);

      font-size: 25px;

      font-weight: 900;

      line-height: 1.35;

      letter-spacing: -0.3px;
    }


    .admin-header p {
      margin: 0;

      color: var(--admin-text-soft);

      font-size: 13px;

      line-height: 1.7;
    }


    .admin-header-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-top: 11px;

      min-height: 30px;

      padding: 5px 11px;

      border-radius: 30px;

      background: var(--admin-primary-soft);

      border: 1px solid #e5d7fa;

      color: var(--admin-primary-dark);

      font-size: 11px;

      font-weight: 800;
    }


    /* =====================================================
       Logout
       ===================================================== */

    .logout-btn {
      position: relative;
      z-index: 3;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      min-width: 125px;
      min-height: 45px;

      padding: 0 17px;

      border: 1px solid #e5d8f5;

      border-radius: 13px;

      background: #faf7ff;

      color: #6d28d9;

      cursor: pointer;

      font-size: 13px;
      font-weight: 800;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;
    }


    .logout-btn:hover {
      background: #f2eaff;

      border-color: #d8c4ef;

      box-shadow:
        0 7px 18px rgba(109, 40, 217, 0.08);
    }


    .logout-btn:active {
      transform: scale(0.97);
    }


    .logout-icon {
      font-size: 16px;
      line-height: 1;
    }


    /* =====================================================
       الرسائل
       ===================================================== */

    .message {
      display: none;

      width: 100%;

      padding: 13px 15px;

      margin-bottom: 18px;

      border-radius: 14px;

      font-size: 13px;

      line-height: 1.8;
    }


    .message.show {
      display: block;
    }


    .message.error {
      background: var(--admin-danger-bg);

      border: 1px solid var(--admin-danger-border);

      color: #b42318;
    }


    .message.success {
      background: var(--admin-success-bg);

      border: 1px solid var(--admin-success-border);

      color: #187a3d;
    }


    .message.warning {
      background: var(--admin-warning-bg);

      border: 1px solid var(--admin-warning-border);

      color: #8a6500;
    }


    /* =====================================================
       الإحصائيات
       ===================================================== */

    .stats-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 14px;

      margin-bottom: 20px;
    }


    .stat-card {
      position: relative;

      min-height: 126px;

      padding: 20px;

      overflow: hidden;

      background: rgba(255, 255, 255, 0.96);

      border: 1px solid var(--admin-border);

      border-radius: var(--admin-radius-lg);

      box-shadow: var(--admin-shadow);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }


    .stat-card:hover {
      transform: translateY(-2px);

      border-color: #e0d5ed;

      box-shadow: var(--admin-shadow-hover);
    }


    .stat-card::before {
      content: "";

      position: absolute;

      width: 95px;
      height: 95px;

      left: -40px;
      bottom: -48px;

      border-radius: 50%;

      background:
        rgba(113, 57, 183, 0.055);
    }


    .stat-card-top {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;
    }


    .stat-card-label {
      color: var(--admin-text-soft);

      font-size: 12px;

      font-weight: 700;

      line-height: 1.6;
    }


    .stat-card-icon {
      width: 34px;
      height: 34px;

      flex: 0 0 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background: var(--admin-primary-soft);

      color: var(--admin-primary);

      font-size: 16px;
    }


    .stat-card strong {
      position: relative;
      z-index: 1;

      display: block;

      color: var(--admin-primary-dark);

      font-size: 29px;

      font-weight: 900;

      line-height: 1.2;

      direction: rtl;
    }


    #pendingAmount {
      font-size: 22px;
    }


    /* =====================================================
       قسم الطلبات
       ===================================================== */

    .requests-section {
      background:
        rgba(255, 255, 255, 0.91);

      border: 1px solid var(--admin-border);

      border-radius: var(--admin-radius-xl);

      padding: 22px;

      box-shadow: var(--admin-shadow);
    }


    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }


    .section-title-wrap {
      min-width: 0;
    }


    .section-title {
      margin: 0;

      color: #302b38;

      font-size: 20px;

      font-weight: 900;

      line-height: 1.5;
    }


    .section-subtitle {
      margin: 5px 0 0;

      color: var(--admin-text-muted);

      font-size: 12px;

      line-height: 1.7;
    }


    /* =====================================================
       أدوات البحث والفلترة
       ===================================================== */

    .requests-tools {
      margin-bottom: 18px;
    }


    .search-box {
      position: relative;

      width: 100%;

      margin-bottom: 11px;
    }


    .search-box input {
      width: 100%;

      min-height: 49px;

      padding:
        0
        45px
        0
        16px;

      outline: none;

      background: #faf9fc;

      border: 1px solid #e8e3ef;

      border-radius: 14px;

      color: #302b38;

      font-family: inherit;

      font-size: 13px;

      direction: rtl;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }


    .search-box input::placeholder {
      color: #a09aa7;
    }


    .search-box input:focus {
      background: #ffffff;

      border-color: #b994e8;

      box-shadow:
        0 0 0 4px rgba(109, 40, 217, 0.065);
    }


    .search-icon {
      position: absolute;

      right: 15px;
      top: 50%;

      transform: translateY(-50%);

      width: 21px;
      height: 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #817a8b;

      font-size: 16px;

      pointer-events: none;
    }


    .filter-tabs {
      display: flex;
      align-items: center;

      gap: 7px;

      overflow-x: auto;

      padding:
        1px
        1px
        3px;

      scrollbar-width: none;
    }


    .filter-tabs::-webkit-scrollbar {
      display: none;
    }


    .filter-btn {
      flex: 0 0 auto;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      min-height: 40px;

      padding: 0 13px;

      border-radius: 12px;

      border: 1px solid #e7e1ef;

      background: #ffffff;

      color: #696270;

      font-family: inherit;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s ease;
    }


    .filter-btn:hover {
      background: #f8f3ff;

      border-color: #d8c8ed;

      color: #6d28d9;
    }


    .filter-btn:active {
      transform: scale(0.97);
    }


    .filter-btn.active {
      background: var(--admin-primary);

      border-color: var(--admin-primary);

      color: #ffffff;

      box-shadow:
        0 5px 14px rgba(113, 57, 183, 0.16);
    }


    .filter-btn span {
      min-width: 22px;
      height: 22px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 6px;

      border-radius: 20px;

      background: #f2edf8;

      color: var(--admin-primary);

      font-size: 10px;

      font-weight: 900;
    }


    .filter-btn.active span {
      background: rgba(255, 255, 255, 0.18);

      color: #ffffff;
    }


    /* =====================================================
       حاوية الطلبات
       ===================================================== */

    #requestsContainer {
      display: flex;

      flex-direction: column;

      gap: 13px;

      min-height: 120px;
    }


    .loading {
      min-height: 180px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #88818f;

      font-size: 13px;

      background: #faf9fc;

      border: 1px dashed #ded6e8;

      border-radius: 18px;
    }


    .empty-state {
      min-height: 200px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      color: #918b98;

      font-size: 13px;

      line-height: 1.8;

      background: #faf9fc;

      border: 1px dashed #ddd4e8;

      border-radius: 18px;

      padding: 25px;
    }


    .empty-state-icon {
      width: 56px;
      height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 11px;

      border-radius: 18px;

      background: #f2edf8;

      color: #8b5cc6;

      font-size: 25px;
    }


    /* =====================================================
       كرت الطلب
       ===================================================== */

    .request-card {
      position: relative;

      padding: 19px;

      overflow: hidden;

      background: #ffffff;

      border: 1px solid #ebe7f1;

      border-radius: var(--admin-radius-lg);

      box-shadow:
        0 5px 20px rgba(80, 50, 120, 0.035);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }


    .request-card:hover {
      transform: translateY(-2px);

      border-color: #dacbed;

      box-shadow:
        0 12px 30px rgba(80, 50, 120, 0.075);
    }


    .request-card.pending {
      border-right:
        4px solid #7c3aed;
    }


    .request-card.approved {
      border-right:
        4px solid var(--admin-success);
    }


    .request-card.rejected {
      border-right:
        4px solid var(--admin-danger);
    }


    /* =====================================================
       أعلى الطلب
       ===================================================== */

    .request-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 18px;

      padding-bottom: 16px;

      margin-bottom: 16px;

      border-bottom:
        1px solid #f0edf4;
    }


    .request-user-area {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 12px;
    }


    .request-avatar {
      width: 49px;
      height: 49px;

      flex: 0 0 49px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #ede1ff,
          #f7f2ff
        );

      border: 1px solid #e5d7fa;

      border-radius: 15px;

      color: #6d28d9;

      font-size: 20px;

      font-weight: 900;
    }


    .request-user-info {
      min-width: 0;
    }


    .request-user {
      color: #292532;

      font-size: 15px;

      font-weight: 900;

      line-height: 1.5;

      word-break: break-word;
    }


    .request-email {
      margin-top: 4px;

      color: #918b98;

      font-size: 11px;

      direction: ltr;

      text-align: right;

      word-break: break-all;
    }


    /* =====================================================
       Badge
       ===================================================== */

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 31px;

      padding: 5px 11px;

      border-radius: 30px;

      font-size: 11px;

      font-weight: 800;

      white-space: nowrap;
    }


    .status-pending {
      background: var(--admin-warning-bg);

      border:
        1px solid var(--admin-warning-border);

      color: #876400;
    }


    .status-approved {
      background: var(--admin-success-bg);

      border:
        1px solid var(--admin-success-border);

      color: #187a3d;
    }


    .status-rejected {
      background: var(--admin-danger-bg);

      border:
        1px solid var(--admin-danger-border);

      color: #b42318;
    }


    /* =====================================================
       معلومات الطلب
       ===================================================== */

    .request-info {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 9px;

      margin-bottom: 12px;
    }


    .info-box {
      min-width: 0;

      padding: 12px 13px;

      background: #faf9fc;

      border:
        1px solid #f0edf4;

      border-radius: 13px;
    }


    .info-box span {
      display: block;

      margin-bottom: 6px;

      color: #938d9b;

      font-size: 10px;

      font-weight: 700;

      line-height: 1.5;
    }


    .info-box strong {
      display: block;

      color: #393341;

      font-size: 12px;

      font-weight: 800;

      line-height: 1.6;

      word-break: break-word;
    }


    .info-box.price-box {
      background: #f8f2ff;

      border-color: #e8daf8;
    }


    .info-box.price-box strong {
      color: #6d28d9;

      font-size: 14px;
    }


    /* =====================================================
       التفاصيل الإضافية
       ===================================================== */

    .request-extra {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 9px;

      margin-bottom: 13px;
    }


    .extra-box {
      min-width: 0;

      padding: 11px 13px;

      background: #fcfbfd;

      border:
        1px solid #f0edf4;

      border-radius: 13px;
    }


    .extra-box span {
      display: block;

      margin-bottom: 5px;

      color: #938d9b;

      font-size: 10px;

      font-weight: 700;
    }


    .extra-box strong {
      display: block;

      color: #4a4551;

      font-size: 12px;

      line-height: 1.65;

      word-break: break-word;
    }


    .payment-reference {
      direction: ltr;

      text-align: right;

      font-family:
        monospace,
        Arial,
        sans-serif;

      color: #5b21b6 !important;
    }


    /* =====================================================
       الملاحظات
       ===================================================== */

    .request-notes {
      padding: 12px 13px;

      margin-bottom: 14px;

      background: #f8f6fc;

      border:
        1px solid #ece6f7;

      border-radius: 13px;

      color: #625c69;

      font-size: 12px;

      line-height: 1.75;

      word-break: break-word;
    }


    .request-notes-title {
      display: block;

      margin-bottom: 4px;

      color: #5b21b6;

      font-size: 11px;

      font-weight: 900;
    }


    /* =====================================================
       أزرار الطلب
       ===================================================== */

    .request-actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 9px;

      padding-top: 2px;
    }


    .action-btn {
      min-height: 46px;

      padding: 0 17px;

      border-radius: 13px;

      cursor: pointer;

      font-family: inherit;

      font-size: 13px;

      font-weight: 900;

      transition:
        transform 0.15s ease,
        opacity 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    .action-btn:hover {
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.08);
    }


    .action-btn:active {
      transform: scale(0.98);
    }


    .action-btn:disabled {
      opacity: 0.55;

      cursor: not-allowed;

      box-shadow: none;
    }


    .approve-btn {
      border: 1px solid #16a34a;

      background: #16a34a;

      color: #ffffff;
    }


    .approve-btn:hover {
      background: #15803d;
    }


    .reject-btn {
      border:
        1px solid var(--admin-danger-border);

      background: var(--admin-danger-bg);

      color: #c62828;
    }


    .reject-btn:hover {
      background: #ffe3e3;
    }


    /* =====================================================
       لا توجد نتائج للبحث / الفلتر
       ===================================================== */

    .filter-empty {
      min-height: 165px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 25px;

      text-align: center;

      background: #faf9fc;

      border:
        1px dashed #ddd4e8;

      border-radius: 17px;

      color: #918b98;

      font-size: 13px;

      line-height: 1.8;
    }


    .filter-empty-icon {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 8px;

      border-radius: 15px;

      background: #f2edf8;

      color: #8b5cc6;

      font-size: 22px;
    }


    /* =====================================================
       Focus
       ===================================================== */

    button:focus-visible,
    input:focus-visible {
      outline:
        3px solid rgba(113, 57, 183, 0.18);

      outline-offset: 2px;
    }


    /* =====================================================
       Tablet
       ===================================================== */

    @media (max-width: 900px) {

      .request-info {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    /* =====================================================
       Mobile
       ===================================================== */

    @media (max-width: 700px) {

      .admin-container {
        padding:
          max(11px, env(safe-area-inset-top))
          10px
          max(30px, env(safe-area-inset-bottom))
          10px;
      }


      .admin-header {
        align-items: stretch;

        flex-direction: column;

        min-height: auto;

        padding: 18px;

        margin-bottom: 12px;

        border-radius: 20px;
      }


      .admin-title-row {
        gap: 9px;
      }


      .admin-title-icon {
        width: 39px;
        height: 39px;

        flex-basis: 39px;

        border-radius: 12px;

        font-size: 17px;
      }


      .admin-header h1 {
        font-size: 21px;
      }


      .admin-header p {
        font-size: 12px;
      }


      .admin-header-badge {
        margin-top: 9px;
      }


      .logout-btn {
        width: 100%;

        min-height: 45px;
      }


      .stats-grid {
        grid-template-columns: 1fr;

        gap: 9px;

        margin-bottom: 12px;
      }


      .stat-card {
        min-height: 93px;

        padding: 15px;

        border-radius: 17px;
      }


      .stat-card strong {
        font-size: 25px;
      }


      #pendingAmount {
        font-size: 20px;
      }


      .requests-section {
        padding: 14px;

        border-radius: 20px;
      }


      .section-header {
        margin-bottom: 16px;
      }


      .section-title {
        font-size: 18px;
      }


      .section-subtitle {
        font-size: 11px;
      }


      .search-box input {
        min-height: 47px;

        font-size: 12px;
      }


      .filter-tabs {
        gap: 6px;
      }


      .filter-btn {
        min-height: 38px;

        padding: 0 11px;

        font-size: 11px;
      }


      .request-card {
        padding: 15px;

        border-radius: 17px;
      }


      .request-top {
        align-items: flex-start;

        flex-direction: column;

        gap: 11px;
      }


      .request-user-area {
        width: 100%;
      }


      .request-avatar {
        width: 44px;
        height: 44px;

        flex-basis: 44px;

        border-radius: 13px;
      }


      .status-badge {
        font-size: 10px;
      }


      .request-info {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 7px;
      }


      .request-extra {
        grid-template-columns: 1fr;
      }


      .info-box {
        padding: 10px;
      }


      .info-box span,
      .extra-box span {
        font-size: 9px;
      }


      .info-box strong,
      .extra-box strong {
        font-size: 11px;
      }


      .request-actions {
        grid-template-columns: 1fr;
      }


      .action-btn {
        width: 100%;
      }

    }


    /* =====================================================
       Small Mobile
       ===================================================== */

    @media (max-width: 380px) {

      .admin-container {
        padding-left: 8px;
        padding-right: 8px;
      }


      .requests-section {
        padding: 12px;
      }


      .request-info {
        grid-template-columns: 1fr;
      }


      .request-user {
        font-size: 14px;
      }


      .request-email {
        font-size: 10px;
      }


      .filter-btn {
        padding: 0 10px;
      }

    }


    /* =====================================================
       Reduced Motion
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }


      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

    }

  </style>

</head>


<body>

  <div class="admin-page">

    <main class="admin-container">


      <!-- =================================================
           Header
           ================================================= -->

      <header class="admin-header">

        <div class="admin-header-content">

          <div class="admin-title-row">

            <div
              class="admin-title-icon"
              aria-hidden="true"
            >
              ⚙️
            </div>

            <div>

              <h1>
                لوحة الإدارة
              </h1>

              <p>
                إدارة اشتراكات Zain Sales
              </p>

            </div>

          </div>


          <div class="admin-header-badge">
            منطقة الإدارة
          </div>

        </div>


        <button
          id="logoutBtn"
          class="logout-btn"
          type="button"
        >

          <span
            class="logout-icon"
            aria-hidden="true"
          >
            ↪
          </span>

          <span>
            تسجيل الخروج
          </span>

        </button>

      </header>


      <!-- =================================================
           Admin Message
           ================================================= -->

      <div
        id="adminMessage"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- =================================================
           Statistics
           ================================================= -->

      <section
        class="stats-grid"
        aria-label="إحصائيات الإدارة"
      >

        <article class="stat-card">

          <div class="stat-card-top">

            <span class="stat-card-label">
              طلبات قيد المراجعة
            </span>

            <div
              class="stat-card-icon"
              aria-hidden="true"
            >
              ⏳
            </div>

          </div>

          <strong id="pendingCount">
            0
          </strong>

        </article>


        <article class="stat-card">

          <div class="stat-card-top">

            <span class="stat-card-label">
              إجمالي الطلبات
            </span>

            <div
              class="stat-card-icon"
              aria-hidden="true"
            >
              📋
            </div>

          </div>

          <strong id="totalCount">
            0
          </strong>

        </article>


        <article class="stat-card">

          <div class="stat-card-top">

            <span class="stat-card-label">
              المبلغ قيد المراجعة
            </span>

            <div
              class="stat-card-icon"
              aria-hidden="true"
            >
              💰
            </div>

          </div>

          <strong id="pendingAmount">
            0 د.ع
          </strong>

        </article>

      </section>


      <!-- =================================================
           Requests
           ================================================= -->

      <section class="requests-section">


        <div class="section-header">

          <div class="section-title-wrap">

            <h2 class="section-title">
              طلبات الاشتراك
            </h2>

            <p class="section-subtitle">
              راجع بيانات الدفع ثم وافق أو ارفض الطلب
            </p>

          </div>

        </div>


        <!-- =================================================
             Search & Filters
             ================================================= -->

        <div class="requests-tools">


          <div class="search-box">

            <span
              class="search-icon"
              aria-hidden="true"
            >
              🔎
            </span>

            <input
              id="requestSearch"
              type="search"
              placeholder="ابحث باسم المندوب أو الإيميل أو رقم العملية..."
              autocomplete="off"
              enterkeyhint="search"
              aria-label="البحث في طلبات الاشتراك"
            >

          </div>


          <div
            class="filter-tabs"
            role="tablist"
            aria-label="فلترة طلبات الاشتراك"
          >

            <button
              type="button"
              class="filter-btn active"
              data-filter="all"
              role="tab"
              aria-selected="true"
            >

              <span>
                الكل
              </span>

              <span id="filterAllCount">
                0
              </span>

            </button>


            <button
              type="button"
              class="filter-btn"
              data-filter="pending"
              role="tab"
              aria-selected="false"
            >

              <span>
                قيد المراجعة
              </span>

              <span id="filterPendingCount">
                0
              </span>

            </button>


            <button
              type="button"
              class="filter-btn"
              data-filter="approved"
              role="tab"
              aria-selected="false"
            >

              <span>
                تمت الموافقة
              </span>

              <span id="filterApprovedCount">
                0
              </span>

            </button>


            <button
              type="button"
              class="filter-btn"
              data-filter="rejected"
              role="tab"
              aria-selected="false"
            >

              <span>
                مرفوض
              </span>

              <span id="filterRejectedCount">
                0
              </span>

            </button>

          </div>

        </div>


        <!-- =================================================
             Requests Container
             ================================================= -->

        <div
          id="requestsContainer"
          class="loading"
          aria-live="polite"
          aria-busy="true"
        >
          جاري تحميل الطلبات...
        </div>


      </section>


    </main>

  </div>


  <!-- =====================================================
       Supabase
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =====================================================
       Configuration
       ===================================================== -->

  <script src="js/config.js"></script>


  <!-- =====================================================
       Authentication
       ===================================================== -->

  <script src="js/auth.js"></script>


  <!-- =====================================================
       Admin Logic
       ===================================================== -->

  <script src="js/admin.js"></script>


</body>

</html>
