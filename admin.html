<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>لوحة الإدارة | Zain Sales</title>

  <meta name="theme-color" content="#6c2bd9">

  <meta
    name="description"
    content="لوحة إدارة الاشتراكات في Zain Sales"
  >

  <link rel="manifest" href="manifest.webmanifest">

  <link
    rel="apple-touch-icon"
    href="assets/icons/apple-touch-icon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      padding: 0;

      min-height: 100vh;

      font-family: "Cairo", sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(108, 43, 217, 0.07),
          transparent 32%
        ),
        #f6f4fa;

      color: #201b2b;

      direction: rtl;
    }


    button,
    input {
      font-family: inherit;
    }


    button {
      border: 0;
      cursor: pointer;
    }


    button:disabled {
      cursor: not-allowed;
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .admin-page {
      width: 100%;
      min-height: 100vh;

      padding:
        max(22px, env(safe-area-inset-top))
        18px
        calc(30px + env(safe-area-inset-bottom));
    }


    .admin-container {
      width: 100%;
      max-width: 1280px;

      margin: 0 auto;
    }


    /* =====================================================
       TOP HEADER
    ===================================================== */

    .admin-header {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 18px;

      padding: 24px 26px;

      margin-bottom: 18px;

      border-radius: 24px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #6c2bd9 0%,
          #7b3fe4 55%,
          #8c52ed 100%
        );

      color: #ffffff;

      box-shadow:
        0 14px 35px rgba(108, 43, 217, 0.20);
    }


    .admin-header::before {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      border-radius: 50%;

      left: -70px;
      top: -90px;

      background: rgba(255,255,255,0.08);
    }


    .admin-header::after {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      border-radius: 50%;

      right: 32%;

      bottom: -90px;

      background: rgba(255,255,255,0.06);
    }


    .admin-header-content {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;

      gap: 15px;

      min-width: 0;
    }


    .admin-header-icon {
      width: 58px;
      height: 58px;

      flex: 0 0 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: rgba(255,255,255,0.15);

      border: 1px solid rgba(255,255,255,0.18);

      backdrop-filter: blur(8px);
    }


    .admin-header-icon svg {
      width: 29px;
      height: 29px;
    }


    .admin-header-text {
      min-width: 0;
    }


    .admin-header-text h1 {
      margin: 0 0 3px;

      font-size: 22px;
      font-weight: 800;

      color: #ffffff;
    }


    .admin-header-text p {
      margin: 0;

      color: rgba(255,255,255,0.78);

      font-size: 13px;
      font-weight: 500;
    }


    .admin-status {
      position: relative;
      z-index: 2;

      display: inline-flex;
      align-items: center;

      gap: 8px;

      flex-shrink: 0;

      padding: 8px 12px;

      border-radius: 999px;

      background: rgba(255,255,255,0.12);

      border: 1px solid rgba(255,255,255,0.16);

      color: #ffffff;

      font-size: 12px;
      font-weight: 700;

      backdrop-filter: blur(8px);
    }


    .admin-status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #8df0bd;

      box-shadow: 0 0 0 4px rgba(141,240,189,0.13);
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    #adminMessage {
      display: none;

      width: 100%;

      padding: 13px 16px;

      margin-bottom: 18px;

      border-radius: 14px;

      font-size: 13px;
      font-weight: 700;

      line-height: 1.8;
    }


    #adminMessage.show {
      display: block;
    }


    #adminMessage.success {
      color: #176c46;

      background: #eaf9f1;

      border: 1px solid #c7eed9;
    }


    #adminMessage.error {
      color: #a52c3d;

      background: #fff0f2;

      border: 1px solid #f3ccd3;
    }


    #adminMessage.warning {
      color: #8a5a10;

      background: #fff8e7;

      border: 1px solid #f1dfae;
    }


    /* =====================================================
       STATISTICS
    ===================================================== */

    .admin-stats {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 14px;

      margin-bottom: 18px;
    }


    .stat-card {
      position: relative;

      display: flex;
      align-items: center;

      gap: 14px;

      min-width: 0;

      padding: 18px;

      background: #ffffff;

      border: 1px solid #ebe7f1;

      border-radius: 20px;

      box-shadow:
        0 7px 22px rgba(42, 25, 67, 0.05);

      overflow: hidden;
    }


    .stat-card::after {
      content: "";

      position: absolute;

      width: 75px;
      height: 75px;

      left: -30px;
      bottom: -38px;

      border-radius: 50%;

      background: rgba(108,43,217,0.04);
    }


    .stat-icon {
      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: #f1ebff;

      color: #6c2bd9;
    }


    .stat-icon svg {
      width: 23px;
      height: 23px;
    }


    .stat-content {
      min-width: 0;
    }


    .stat-label {
      margin: 0 0 2px;

      color: #81798e;

      font-size: 12px;
      font-weight: 600;
    }


    .stat-value {
      margin: 0;

      color: #241d30;

      font-size: 23px;
      font-weight: 800;

      line-height: 1.25;
    }


    /* =====================================================
       REQUEST SECTION
    ===================================================== */

    .requests-panel {
      background: #ffffff;

      border: 1px solid #ebe7f1;

      border-radius: 24px;

      box-shadow:
        0 8px 30px rgba(42, 25, 67, 0.055);

      overflow: hidden;
    }


    .requests-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 18px;

      padding: 22px 24px;

      border-bottom: 1px solid #eeeaf3;

      background: #ffffff;
    }


    .requests-heading {
      min-width: 0;
    }


    .requests-heading h2 {
      margin: 0 0 4px;

      color: #211a2c;

      font-size: 18px;
      font-weight: 800;
    }


    .requests-heading p {
      margin: 0;

      color: #8b8394;

      font-size: 12px;
      font-weight: 500;
    }


    /* =====================================================
       SEARCH
    ===================================================== */

    .search-box {
      position: relative;

      width: 360px;

      flex-shrink: 0;
    }


    .search-box-icon {
      position: absolute;

      top: 50%;
      right: 15px;

      width: 19px;
      height: 19px;

      transform: translateY(-50%);

      color: #91889b;

      pointer-events: none;
    }


    .search-box input {
      width: 100%;
      height: 48px;

      padding:
        0
        46px
        0
        16px;

      border-radius: 14px;

      border: 1px solid #e5e0eb;

      outline: none;

      background: #faf9fc;

      color: #27202f;

      font-size: 13px;
      font-weight: 600;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    .search-box input::placeholder {
      color: #aaa2b1;
    }


    .search-box input:focus {
      background: #ffffff;

      border-color: #9d7adf;

      box-shadow:
        0 0 0 4px rgba(108,43,217,0.08);
    }


    /* =====================================================
       FILTERS
    ===================================================== */

    .requests-filters {
      display: flex;
      align-items: center;

      gap: 8px;

      padding: 14px 24px;

      border-bottom: 1px solid #eeeaf3;

      overflow-x: auto;

      scrollbar-width: none;
    }


    .requests-filters::-webkit-scrollbar {
      display: none;
    }


    .filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      flex: 0 0 auto;

      height: 36px;

      padding: 0 14px;

      border-radius: 10px;

      border: 1px solid #e5e0eb;

      background: #ffffff;

      color: #756d80;

      font-size: 12px;
      font-weight: 700;

      transition:
        0.2s ease;
    }


    .filter-btn:hover {
      border-color: #cbb7ed;

      color: #6c2bd9;
    }


    .filter-btn.active {
      color: #ffffff;

      background: #6c2bd9;

      border-color: #6c2bd9;

      box-shadow:
        0 5px 14px rgba(108,43,217,0.18);
    }


    /* =====================================================
       REQUESTS LIST
    ===================================================== */

    #requestsContainer {
      padding: 20px;
    }


    .requests-list {
      display: flex;
      flex-direction: column;

      gap: 14px;
    }


    /* =====================================================
       REQUEST CARD
    ===================================================== */

    .request-card {
      position: relative;

      width: 100%;

      padding: 20px;

      border-radius: 20px;

      border: 1px solid #e8e3ee;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #fcfbfd 100%
        );

      box-shadow:
        0 5px 18px rgba(39, 25, 55, 0.045);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }


    .request-card:hover {
      transform: translateY(-2px);

      border-color: #d8c9ec;

      box-shadow:
        0 10px 26px rgba(39, 25, 55, 0.075);
    }


    .request-card.pending {
      border-right: 3px solid #6c2bd9;
    }


    .request-card.approved {
      border-right: 3px solid #27a96d;
    }


    .request-card.rejected {
      border-right: 3px solid #d85468;
    }


    /* =====================================================
       CARD TOP
    ===================================================== */

    .request-card-top {
      display: grid;

      grid-template-columns:
        minmax(240px, 1.2fr)
        minmax(160px, 0.7fr);

      align-items: center;

      gap: 20px;

      padding-bottom: 18px;

      border-bottom: 1px solid #eeeaf3;
    }


    .request-representative {
      display: flex;
      align-items: center;

      gap: 13px;

      min-width: 0;
    }


    .request-avatar {
      width: 58px;
      height: 58px;

      flex: 0 0 58px;

      border-radius: 17px;

      object-fit: cover;

      background: #f0eafb;

      border: 2px solid #ffffff;

      box-shadow:
        0 0 0 1px #e1d9eb,
        0 5px 14px rgba(45, 27, 67, 0.08);
    }


    .request-avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;

      color: #6c2bd9;

      background:
        linear-gradient(
          135deg,
          #f0e8ff,
          #e8ddfa
        );

      font-size: 18px;
      font-weight: 800;
    }


    .request-representative-info {
      min-width: 0;
    }


    .request-representative-name {
      margin: 0 0 2px;

      color: #241d2e;

      font-size: 15px;
      font-weight: 800;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }


    .request-representative-email {
      margin: 0;

      color: #898090;

      font-size: 12px;
      font-weight: 500;

      direction: ltr;
      text-align: right;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }


    .request-number-area {
      display: flex;
      align-items: center;
      justify-content: flex-start;

      gap: 10px;

      min-width: 0;
    }


    .request-number-label {
      color: #948b9d;

      font-size: 11px;
      font-weight: 600;
    }


    .request-number-value {
      display: inline-flex;
      align-items: center;

      min-width: 0;

      padding: 7px 10px;

      border-radius: 9px;

      background: #f7f4fb;

      border: 1px solid #ebe5f2;

      color: #5f5469;

      font-family: Arial, sans-serif;

      font-size: 11px;

      direction: ltr;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .request-status-area {
      display: flex;
      justify-content: flex-start;
    }


    .status-badge {
      display: inline-flex;
      align-items: center;

      gap: 7px;

      padding: 7px 12px;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 800;
    }


    .status-badge::before {
      content: "";

      width: 6px;
      height: 6px;

      border-radius: 50%;
    }


    .status-badge.pending {
      color: #7a5310;

      background: #fff6df;

      border: 1px solid #f1dfae;
    }


    .status-badge.pending::before {
      background: #d79b27;
    }


    .status-badge.approved {
      color: #176a47;

      background: #eaf9f1;

      border: 1px solid #c9edd9;
    }


    .status-badge.approved::before {
      background: #2bad70;
    }


    .status-badge.rejected {
      color: #a32e40;

      background: #fff0f2;

      border: 1px solid #f1ccd3;
    }


    .status-badge.rejected::before {
      background: #d95368;
    }


    /* =====================================================
       INFORMATION GRID
    ===================================================== */

    .request-info-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 10px;

      padding: 18px 0;
    }


    .request-info-item {
      min-width: 0;

      padding: 12px 13px;

      border-radius: 13px;

      background: #faf9fc;

      border: 1px solid #eeeaf3;
    }


    .request-info-label {
      display: flex;
      align-items: center;

      gap: 6px;

      margin-bottom: 5px;

      color: #958c9e;

      font-size: 10px;
      font-weight: 600;
    }


    .request-info-label svg {
      width: 14px;
      height: 14px;

      flex: 0 0 14px;

      color: #8661b9;
    }


    .request-info-value {
      min-width: 0;

      color: #322a3c;

      font-size: 12px;
      font-weight: 800;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }


    .request-info-value.amount {
      color: #6c2bd9;

      font-size: 14px;
    }


    /* =====================================================
       REFERENCE / NOTES
    ===================================================== */

    .request-extra-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1.5fr);

      gap: 10px;

      margin-bottom: 16px;
    }


    .request-extra {
      min-width: 0;

      padding: 13px 14px;

      border-radius: 13px;

      background: #ffffff;

      border: 1px solid #ebe6f0;
    }


    .request-extra-label {
      display: flex;
      align-items: center;

      gap: 6px;

      margin-bottom: 5px;

      color: #958c9e;

      font-size: 10px;
      font-weight: 700;
    }


    .request-extra-label svg {
      width: 14px;
      height: 14px;

      color: #8661b9;
    }


    .request-extra-value {
      color: #42394c;

      font-size: 12px;
      font-weight: 700;

      overflow-wrap: anywhere;
    }


    .request-extra-value.reference {
      font-family: Arial, sans-serif;

      direction: ltr;
      text-align: right;
    }


    /* =====================================================
       ACTIONS
    ===================================================== */

    .request-actions {
      display: flex;
      align-items: center;

      gap: 10px;

      padding-top: 16px;

      border-top: 1px solid #eeeaf3;
    }


    .request-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 43px;

      padding: 0 18px;

      border-radius: 12px;

      font-size: 12px;
      font-weight: 800;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        opacity 0.15s ease;
    }


    .request-action-btn svg {
      width: 17px;
      height: 17px;
    }


    .request-action-btn:active {
      transform: scale(0.97);
    }


    .approve-btn {
      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #25a66b,
          #2db978
        );

      box-shadow:
        0 5px 13px rgba(38,169,108,0.17);
    }


    .approve-btn:hover {
      box-shadow:
        0 7px 17px rgba(38,169,108,0.25);
    }


    .reject-btn {
      color: #c43e52;

      background: #fff3f5;

      border: 1px solid #f1d2d8;
    }


    .reject-btn:hover {
      background: #ffe9ed;
    }


    .request-reviewed {
      display: flex;
      align-items: center;

      gap: 7px;

      color: #8b8292;

      font-size: 11px;
      font-weight: 600;
    }


    .request-reviewed svg {
      width: 15px;
      height: 15px;
    }


    /* =====================================================
       EMPTY STATE
    ===================================================== */

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 260px;

      padding: 30px;

      text-align: center;
    }


    .empty-state-icon {
      width: 62px;
      height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 14px;

      border-radius: 19px;

      background: #f2edfa;

      color: #8060ad;
    }


    .empty-state-icon svg {
      width: 28px;
      height: 28px;
    }


    .empty-state h3 {
      margin: 0 0 5px;

      color: #342b3d;

      font-size: 15px;
      font-weight: 800;
    }


    .empty-state p {
      max-width: 400px;

      margin: 0;

      color: #918898;

      font-size: 12px;
      font-weight: 500;

      line-height: 1.8;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 220px;

      color: #857b91;

      font-size: 13px;
      font-weight: 700;
    }


    .loading-spinner {
      width: 22px;
      height: 22px;

      margin-left: 10px;

      border-radius: 50%;

      border: 3px solid #e8def6;

      border-top-color: #6c2bd9;

      animation:
        adminSpin 0.8s linear infinite;
    }


    @keyframes adminSpin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================================
       ADMIN ACCOUNT / LOGOUT
    ===================================================== */

    .admin-account-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 18px;

      margin-top: 18px;

      padding: 17px 20px;

      border-radius: 20px;

      background: #ffffff;

      border: 1px solid #ebe7f1;

      box-shadow:
        0 7px 22px rgba(42,25,67,0.045);
    }


    .admin-account-info {
      display: flex;
      align-items: center;

      gap: 12px;

      min-width: 0;
    }


    .admin-account-icon {
      width: 45px;
      height: 45px;

      flex: 0 0 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      color: #6c2bd9;

      background: #f1ebff;
    }


    .admin-account-icon svg {
      width: 21px;
      height: 21px;
    }


    .admin-account-text {
      min-width: 0;
    }


    .admin-account-text strong {
      display: block;

      margin-bottom: 2px;

      color: #312839;

      font-size: 12px;
      font-weight: 800;
    }


    .admin-account-text span {
      display: block;

      color: #928999;

      font-size: 11px;
      font-weight: 500;

      direction: ltr;
      text-align: right;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    .logout-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 42px;

      padding: 0 16px;

      border-radius: 11px;

      color: #a7364a;

      background: #fff1f4;

      border: 1px solid #f1d3da;

      font-size: 12px;
      font-weight: 800;

      flex-shrink: 0;

      transition: 0.2s ease;
    }


    .logout-btn:hover {
      background: #ffe7ec;

      border-color: #e9bdc7;
    }


    .logout-btn svg {
      width: 17px;
      height: 17px;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 1000px) {

      .request-info-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }


      .request-card-top {
        grid-template-columns:
          minmax(0, 1fr)
          auto;
      }

    }


    @media (max-width: 780px) {

      .admin-page {
        padding:
          14px
          12px
          calc(22px + env(safe-area-inset-bottom));
      }


      .admin-header {
        padding: 19px;

        border-radius: 20px;
      }


      .admin-header-icon {
        width: 48px;
        height: 48px;

        flex-basis: 48px;

        border-radius: 15px;
      }


      .admin-header-text h1 {
        font-size: 18px;
      }


      .admin-header-text p {
        font-size: 11px;
      }


      .admin-status {
        display: none;
      }


      .admin-stats {
        gap: 9px;
      }


      .stat-card {
        padding: 13px;

        gap: 9px;

        border-radius: 16px;
      }


      .stat-icon {
        width: 40px;
        height: 40px;

        flex-basis: 40px;

        border-radius: 12px;
      }


      .stat-icon svg {
        width: 19px;
        height: 19px;
      }


      .stat-label {
        font-size: 10px;
      }


      .stat-value {
        font-size: 18px;
      }


      .requests-panel {
        border-radius: 19px;
      }


      .requests-toolbar {
        flex-direction: column;
        align-items: stretch;

        padding: 18px;
      }


      .search-box {
        width: 100%;
      }


      .requests-filters {
        padding:
          12px 18px;
      }


      #requestsContainer {
        padding: 14px;
      }


      .request-card {
        padding: 15px;

        border-radius: 17px;
      }


      .request-card-top {
        grid-template-columns: 1fr;

        gap: 12px;

        padding-bottom: 14px;
      }


      .request-number-area,
      .request-status-area {
        justify-content: flex-start;
      }


      .request-info-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 8px;

        padding: 14px 0;
      }


      .request-extra-grid {
        grid-template-columns: 1fr;
      }


      .request-actions {
        flex-wrap: wrap;
      }


      .request-action-btn {
        flex: 1 1 140px;
      }


      .admin-account-panel {
        align-items: stretch;

        flex-direction: column;

        padding: 15px;
      }


      .logout-btn {
        width: 100%;
      }

    }


    @media (max-width: 430px) {

      .admin-stats {
        grid-template-columns:
          1fr;
      }


      .stat-card {
        min-height: 67px;
      }


      .request-info-grid {
        grid-template-columns:
          1fr 1fr;
      }


      .request-info-item {
        padding: 10px;
      }


      .request-info-label {
        font-size: 9px;
      }


      .request-info-value {
        font-size: 11px;
      }


      .request-info-value.amount {
        font-size: 13px;
      }


      .request-representative-email {
        max-width: 210px;
      }

    }
.request-extra-grid {
  display: flex;
  align-items: center;
  justify-content:space-around;
  gap: 12px;
  width: 100%;
}

.request-extra {
  flex: 1;
  min-width: 0;
}

.request-extra-value.reference {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.request-status-area {
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
  </style>

</head>


<body>


  <main class="admin-page">

    <div class="admin-container">


      <!-- =================================================
           HEADER
      ================================================== -->

      <header class="admin-header">

        <div class="admin-header-content">

          <div class="admin-header-icon">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3l8 4v5c0 4.7-3.4 8.2-8 9-4.6-.8-8-4.3-8-9V7l8-4z"/>
              <path d="M9.5 12l1.7 1.7 3.6-3.6"/>
            </svg>

          </div>


          <div class="admin-header-text">

            <h1>
              لوحة الإدارة
            </h1>

            <p>
              إدارة طلبات الاشتراك ومتابعة المندوبين
            </p>

          </div>

        </div>


        <div class="admin-status">

          <span class="admin-status-dot"></span>

          النظام يعمل

        </div>

      </header>


      <!-- =================================================
           MESSAGE
      ================================================== -->

      <div
        id="adminMessage"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- =================================================
           STATISTICS
      ================================================== -->

      <section
        class="admin-stats"
        aria-label="إحصائيات الاشتراكات"
      >


        <article class="stat-card">

          <div class="stat-icon">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2h-11A2.5 2.5 0 0 1 4 18.5v-13z"/>
              <path d="M8 7h8"/>
              <path d="M8 11h8"/>
              <path d="M8 15h5"/>
            </svg>

          </div>


          <div class="stat-content">

            <p class="stat-label">
              إجمالي الطلبات
            </p>

            <p
              class="stat-value"
              id="totalRequests"
            >
              0
            </p>

          </div>

        </article>


        <article class="stat-card">

          <div class="stat-icon">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M12 7.5v9"/>
              <path d="M15 9.5c-.5-1-1.4-1.5-2.8-1.5-1.5 0-2.5.8-2.5 1.8 0 1.2 1.2 1.6 2.6 1.9 1.5.3 2.7.7 2.7 2 0 1.1-1 2-2.7 2-1.4 0-2.4-.5-3-1.5"/>
            </svg>

          </div>


          <div class="stat-content">

            <p class="stat-label">
              قيد المراجعة
            </p>

            <p
              class="stat-value"
              id="pendingRequests"
            >
              0
            </p>

          </div>

        </article>


        <article class="stat-card">

          <div class="stat-icon">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 12.5l4.2 4.2L20 5"/>
              <path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/>
            </svg>

          </div>


          <div class="stat-content">

            <p class="stat-label">
              تمت الموافقة
            </p>

            <p
              class="stat-value"
              id="approvedRequests"
            >
              0
            </p>

          </div>

        </article>


      </section>


      <!-- =================================================
           REQUESTS
      ================================================== -->

      <section class="requests-panel">


        <div class="requests-toolbar">


          <div class="requests-heading">

            <h2>
              طلبات الاشتراك
            </h2>

            <p>
              مراجعة طلبات المندوبين واتخاذ الإجراء المناسب
            </p>

          </div>


          <!-- البحث مباشر أثناء الكتابة -->

          <div class="search-box">

            <svg
              class="search-box-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="6.5"/>
              <path d="M16 16l5 5"/>
            </svg>


            <input
              type="search"
              id="requestSearch"
              placeholder="ابحث باسم المندوب أو البريد أو رقم العملية"
              autocomplete="off"
              aria-label="البحث في طلبات الاشتراك"
            >

          </div>


        </div>


        <!--
          لا يوجد زر "الكل"
          البحث أعلاه مباشر أثناء الكتابة
        -->

        <div
          class="requests-filters"
          id="requestFilters"
          aria-label="تصفية الطلبات"
        >

          <button
            type="button"
            class="filter-btn active"
            data-filter="pending"
            aria-selected="true"
          >
            قيد المراجعة
          </button>


          <button
            type="button"
            class="filter-btn"
            data-filter="approved"
            aria-selected="false"
          >
            تمت الموافقة
          </button>


          <button
            type="button"
            class="filter-btn"
            data-filter="rejected"
            aria-selected="false"
          >
            مرفوضة
          </button>

        </div>


        <div id="requestsContainer">

          <div class="loading-state">

            <span class="loading-spinner"></span>

            جاري تحميل الطلبات...

          </div>

        </div>


      </section>


      <!-- =================================================
           ADMIN ACCOUNT / LOGOUT
      ================================================== -->

      <section class="admin-account-panel">


        <div class="admin-account-info">

          <div class="admin-account-icon">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3l7 3.5v5.2c0 4.1-2.8 7.4-7 8.3-4.2-.9-7-4.2-7-8.3V6.5L12 3z"/>
              <path d="M9.5 11.8l1.7 1.7 3.5-3.5"/>
            </svg>

          </div>


          <div class="admin-account-text">

            <strong>
              حساب المسؤول
            </strong>

            <span id="adminAccountEmail">
              جاري التحقق...
            </span>

          </div>

        </div>


        <button
          type="button"
          id="logoutBtn"
          class="logout-btn"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10 5H6.5A2.5 2.5 0 0 0 4 7.5v9A2.5 2.5 0 0 0 6.5 19H10"/>
            <path d="M14 8l4 4-4 4"/>
            <path d="M18 12H9"/>
          </svg>

          تسجيل الخروج

        </button>


      </section>


    </div>

  </main>


  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =====================================================
       CONFIG
  ====================================================== -->

  <script src="js/config.js"></script>


  <!-- =====================================================
       AUTH
  ====================================================== -->

  <script src="js/auth.js"></script>


  <!-- =====================================================
       ADMIN JS
  ====================================================== -->

  <script src="js/admin.js"></script>


</body>

</html>
