<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#7139b7"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Zain Sales"
  >

  <title>
    تأكيد البريد الإلكتروني - Zain Sales
  </title>


  <link
    rel="stylesheet"
    href="css/style.css"
  >


  <style>

    /* =====================================================
       Zain Sales
       Email Verification
    ===================================================== */

    .verify-page {

      min-height: 100vh;

      min-height: 100dvh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px 16px;

      background:
        radial-gradient(
          circle at top right,
          rgba(113, 57, 183, 0.12),
          transparent 35%
        ),
        #f6f3fa;

    }


    .verify-card {

      width: 100%;

      max-width: 430px;

      background: #ffffff;

      border: 1px solid #ebe5f1;

      border-radius: 24px;

      padding: 32px 24px;

      box-shadow:
        0 18px 50px
        rgba(64, 35, 90, 0.10);

      text-align: center;

    }


    /* =====================================================
       Logo
    ===================================================== */

    .verify-logo {

      width: 64px;

      height: 64px;

      margin:
        0 auto 18px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #7139b7,
          #8e5bc9
        );

      color: #ffffff;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 25px;

      font-weight: 800;

      box-shadow:
        0 10px 24px
        rgba(113, 57, 183, 0.22);

    }


    /* =====================================================
       Title
    ===================================================== */

    .verify-card h1 {

      margin:
        0 0 10px;

      color:
        #262032;

      font-size:
        24px;

      font-weight:
        800;

    }


    .verify-description {

      margin:
        0 auto 8px;

      max-width:
        340px;

      color:
        #6f6879;

      font-size:
        15px;

      line-height:
        1.8;

    }


    .verify-email {

      margin:
        0 0 24px;

      color:
        #7139b7;

      font-size:
        15px;

      font-weight:
        700;

      direction:
        ltr;

      word-break:
        break-word;

    }


    /* =====================================================
       OTP
    ===================================================== */

    .otp-input {

      width:
        100%;

      height:
        62px;

      border:
        2px solid #e4dced;

      border-radius:
        16px;

      outline:
        none;

      background:
        #fbf9fd;

      color:
        #262032;

      font-size:
        27px;

      font-weight:
        800;

      letter-spacing:
        9px;

      text-align:
        center;

      direction:
        ltr;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;

    }


    .otp-input:focus {

      border-color:
        #7139b7;

      background:
        #ffffff;

      box-shadow:
        0 0 0 4px
        rgba(113, 57, 183, 0.10);

    }


    .otp-input.error {

      border-color:
        #c0392b;

      background:
        #fffafa;

      box-shadow:
        0 0 0 4px
        rgba(192, 57, 43, 0.07);

    }


    .otp-input.success {

      border-color:
        #23834a;

      background:
        #f4fbf6;

    }


    .otp-input:disabled {

      opacity:
        0.65;

      cursor:
        not-allowed;

    }


    .otp-input::placeholder {

      color:
        #b9afc4;

      letter-spacing:
        5px;

    }


    /* =====================================================
       Verify Button
    ===================================================== */

    .verify-btn {

      width:
        100%;

      height:
        52px;

      margin-top:
        18px;

      border:
        0;

      border-radius:
        14px;

      background:
        linear-gradient(
          135deg,
          #7139b7,
          #6530a7
        );

      color:
        #ffffff;

      font-size:
        16px;

      font-weight:
        800;

      cursor:
        pointer;

      box-shadow:
        0 9px 22px
        rgba(113, 57, 183, 0.20);

      transition:
        transform 0.15s ease,
        opacity 0.2s ease;

    }


    .verify-btn:active {

      transform:
        scale(0.98);

    }


    .verify-btn:disabled {

      opacity:
        0.6;

      cursor:
        not-allowed;

    }


    /* =====================================================
       Loading
    ===================================================== */

    .verify-loading {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        8px;

    }


    .loading-spinner {

      width:
        16px;

      height:
        16px;

      border:
        2px solid
        rgba(255,255,255,0.4);

      border-top-color:
        #ffffff;

      border-radius:
        50%;

      animation:
        verifySpin 0.7s linear infinite;

    }


    @keyframes verifySpin {

      to {
        transform:
          rotate(360deg);
      }

    }


    /* =====================================================
       Message
    ===================================================== */

    .verify-message {

      min-height:
        24px;

      margin:
        16px 0 0;

      font-size:
        14px;

      line-height:
        1.7;

    }


    .verify-message.success {

      color:
        #23834a;

    }


    .verify-message.error {

      color:
        #c0392b;

    }


    .verify-message.info {

      color:
        #827b8c;

    }


    /* =====================================================
       Resend
    ===================================================== */

    .resend-wrapper {

      margin-top:
        22px;

    }


    .resend-text {

      margin:
        0 0 8px;

      color:
        #827b8c;

      font-size:
        13px;

    }


    .resend-btn {

      border:
        0;

      background:
        transparent;

      color:
        #7139b7;

      font-size:
        14px;

      font-weight:
        800;

      cursor:
        pointer;

      padding:
        6px 10px;

    }


    .resend-btn:disabled {

      color:
        #aaa2b0;

      cursor:
        not-allowed;

    }


    /* =====================================================
       Lock Message
    ===================================================== */

    .lock-message {

      display:
        none;

      margin-top:
        18px;

      padding:
        10px 14px;

      border-radius:
        12px;

      background:
        #fff4f2;

      color:
        #b43a2e;

      font-size:
        13px;

      line-height:
        1.8;

    }


    .lock-message.show {

      display:
        block;

    }


    .lock-time {

      font-weight:
        800;

      direction:
        ltr;

      display:
        inline-block;

    }


    /* =====================================================
       Back
    ===================================================== */

    .back-login {

      display:
        inline-block;

      margin-top:
        20px;

      color:
        #827b8c;

      font-size:
        13px;

      text-decoration:
        none;

    }


    .back-login:hover {

      color:
        #7139b7;

    }


    /* =====================================================
       Mobile
    ===================================================== */

    @media (max-width: 480px) {

      .verify-page {

        padding:
          18px 12px;

      }


      .verify-card {

        padding:
          28px 18px;

        border-radius:
          20px;

      }


      .otp-input {

        height:
          58px;

        font-size:
          25px;

        letter-spacing:
          8px;

      }

    }


  </style>

</head>


<body>


  <main class="verify-page">


    <section class="verify-card">


      <!-- Logo -->

      <div class="verify-logo">

        Z

      </div>


      <!-- Title -->

      <h1 id="verifyTitle">

        تأكيد البريد الإلكتروني

      </h1>


      <!-- Description -->

      <p
        class="verify-description"
        id="verifyDescription"
      >

        أرسلنا رمز تأكيد مكوّن من 6 أرقام إلى:

      </p>


      <!-- Email -->

      <div
        id="verifyEmail"
        class="verify-email"
      >

        —

      </div>


      <!-- OTP -->

      <input
        type="text"
        id="otpInput"
        class="otp-input"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        minlength="6"
        pattern="[0-9]{6}"
        placeholder="••••••"
        aria-label="رمز التأكيد"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
      >


      <!-- Verify -->

      <button
        type="button"
        id="verifyBtn"
        class="verify-btn"
      >

        تأكيد البريد الإلكتروني

      </button>


      <!-- Message -->

      <p
        id="verifyMessage"
        class="verify-message"
        aria-live="polite"
      ></p>


      <!-- Resend -->

      <div class="resend-wrapper">

        <p class="resend-text">

          ما وصلك الرمز؟

        </p>


        <button
          type="button"
          id="resendBtn"
          class="resend-btn"
          disabled
        >

          إعادة إرسال الرمز (59)

        </button>

      </div>


      <!-- Lock -->

      <div
        id="lockMessage"
        class="lock-message"
      >

        تم إيقاف المحاولات مؤقتاً لحماية حسابك.

        <br>

        يمكنك المحاولة مرة أخرى بعد:

        <span
          id="lockTime"
          class="lock-time"
        >
          5:00
        </span>

      </div>


      <!-- Back -->

      <a
        href="signup.html"
        class="back-login"
      >

        العودة إلى إنشاء الحساب

      </a>


    </section>


  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
  ></script>


  <script src="js/config.js"></script>


  <script>


    /* =====================================================
       Zain Sales
       Verification Logic
    ===================================================== */


    const email =
      sessionStorage.getItem(
        "zainSalesSignupEmail"
      );


    const emailElement =
      document.getElementById(
        "verifyEmail"
      );


    const otpInput =
      document.getElementById(
        "otpInput"
      );


    const verifyBtn =
      document.getElementById(
        "verifyBtn"
      );


    const verifyMessage =
      document.getElementById(
        "verifyMessage"
      );


    const resendBtn =
      document.getElementById(
        "resendBtn"
      );


    const lockMessage =
      document.getElementById(
        "lockMessage"
      );


    const lockTime =
      document.getElementById(
        "lockTime"
      );


    const verifyTitle =
      document.getElementById(
        "verifyTitle"
      );


    const verifyDescription =
      document.getElementById(
        "verifyDescription"
      );


    let resendTimer = null;

    let lockTimer = null;

    let failedAttempts = 0;

    let isVerifying = false;

    let isLocked = false;


    /*
      إعادة إرسال الرمز:
      يبدأ مباشرة من 59 ثانية
    */

    const RESEND_SECONDS = 59;


    /*
      بعد 3 محاولات فاشلة:
      إيقاف لمدة 5 دقائق
    */

    const MAX_ATTEMPTS = 3;

    const LOCK_SECONDS = 5 * 60;


    /* =====================================================
       Email
    ===================================================== */

    if (!email) {

      window.location.replace(
        "signup.html"
      );

    } else {

      emailElement.textContent =
        email;

    }


    /* =====================================================
       Message
    ===================================================== */

    function showMessage(
      text,
      type = ""
    ) {

      verifyMessage.textContent =
        text;

      verifyMessage.className =
        `verify-message ${type}`;

    }


    /* =====================================================
       OTP Input
    ===================================================== */

    otpInput.addEventListener(
      "input",
      () => {

        otpInput.value =
          otpInput.value
            .replace(/\D/g, "")
            .slice(0, 6);


        otpInput.classList.remove(
          "error"
        );


        /*
          عند اكتمال 6 أرقام:
          تحقق مباشرة
        */

        if (
          otpInput.value.length === 6 &&
          !isVerifying &&
          !isLocked
        ) {

          verifyEmail();

        }

      }
    );


    /* =====================================================
       Paste
    ===================================================== */

    otpInput.addEventListener(
      "paste",
      event => {

        event.preventDefault();

        const pasted =
          event.clipboardData
            ?.getData("text") || "";


        otpInput.value =
          pasted
            .replace(/\D/g, "")
            .slice(0, 6);


        if (
          otpInput.value.length === 6
        ) {

          verifyEmail();

        }

      }
    );


    /* =====================================================
       Verify
    ===================================================== */

    async function verifyEmail() {

      if (
        isVerifying ||
        isLocked
      ) {

        return;

      }


      const token =
        otpInput.value.trim();


      if (!email) {

        window.location.replace(
          "signup.html"
        );

        return;

      }


      if (
        !/^\d{6}$/.test(token)
      ) {

        otpInput.classList.add(
          "error"
        );

        showMessage(
          "أدخل رمز التأكيد المكوّن من 6 أرقام.",
          "error"
        );

        return;

      }


      isVerifying = true;

      verifyBtn.disabled =
        true;


      verifyBtn.innerHTML = `

        <span class="verify-loading">

          <span class="loading-spinner"></span>

          جاري التحقق...

        </span>

      `;


      showMessage(
        "جاري التحقق من رمز التأكيد...",
        "info"
      );


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.verifyOtp({

            email,

            token,

            type: "signup"

          });


        if (error) {

          console.error(
            "Email OTP verification error:",
            error
          );

          throw error;

        }


        /* ================================================
           SUCCESS
        ================================================= */

        failedAttempts = 0;


        otpInput.classList.remove(
          "error"
        );


        otpInput.classList.add(
          "success"
        );


        verifyBtn.disabled =
          true;


        verifyBtn.innerHTML = `

          تم تأكيد البريد الإلكتروني ✓

        `;


        verifyTitle.textContent =
          "تم تأكيد البريد الإلكتروني";


        verifyDescription.textContent =
          "تم التحقق من حسابك بنجاح، سيتم نقلك الآن إلى الاشتراك.";


        showMessage(
          "تم تأكيد البريد الإلكتروني بنجاح.",
          "success"
        );


        sessionStorage.removeItem(
          "zainSalesSignupEmail"
        );


        setTimeout(
          () => {

            window.location.replace(
              "subscription.html"
            );

          },
          1000
        );


      } catch (error) {

        console.error(
          "Verify email error:",
          error
        );


        failedAttempts++;


        isVerifying = false;


        verifyBtn.disabled =
          false;


        verifyBtn.textContent =
          "تأكيد البريد الإلكتروني";


        otpInput.classList.add(
          "error"
        );


        showMessage(
          "رمز التأكيد غير صحيح أو انتهت صلاحيته. حاول مرة أخرى.",
          "error"
        );


        /*
          بعد 3 محاولات فاشلة
        */

        if (
          failedAttempts >=
          MAX_ATTEMPTS
        ) {

          startLock();

        }

      }

    }


    /* =====================================================
       Manual Verify Button
    ===================================================== */

    verifyBtn.addEventListener(
      "click",
      verifyEmail
    );


    /* =====================================================
       Resend Timer
    ===================================================== */

    function startResendTimer() {

      let seconds =
        RESEND_SECONDS;


      resendBtn.disabled =
        true;


      resendBtn.textContent =
        `إعادة إرسال الرمز (${seconds})`;


      clearInterval(
        resendTimer
      );


      resendTimer =
        setInterval(
          () => {

            seconds--;


            if (
              seconds <= 0
            ) {

              clearInterval(
                resendTimer
              );


              resendBtn.disabled =
                false;


              resendBtn.textContent =
                "إعادة إرسال الرمز";


              return;

            }


            resendBtn.textContent =
              `إعادة إرسال الرمز (${seconds})`;

          },
          1000
        );

    }


    /* =====================================================
       Resend
    ===================================================== */

    resendBtn.addEventListener(
      "click",
      async () => {

        if (
          !email ||
          isLocked
        ) {

          return;

        }


        resendBtn.disabled =
          true;


        showMessage(
          "جاري إرسال رمز التأكيد...",
          "info"
        );


        try {

          const {
            error
          } =
            await supabaseClient.auth.resend({

              type: "signup",

              email

            });


          if (error) {

            console.error(
              "Resend OTP error:",
              error
            );

            throw error;

          }


          /*
            إعادة ضبط المحاولات
            لأن المستخدم استلم رمزاً جديداً
          */

          failedAttempts = 0;


          otpInput.value = "";


          otpInput.classList.remove(
            "error"
          );


          showMessage(
            "تم إرسال رمز تأكيد جديد إلى بريدك الإلكتروني.",
            "success"
          );


          startResendTimer();


          setTimeout(
            () => {

              otpInput.focus();

            },
            100
          );


        } catch (error) {

          console.error(
            "Resend email error:",
            error
          );


          showMessage(
            "تعذر إرسال رمز جديد حالياً. حاول بعد قليل.",
            "error"
          );


          resendBtn.disabled =
            false;


          resendBtn.textContent =
            "إعادة إرسال الرمز";

        }

      }
    );


    /* =====================================================
       5 Minute Lock
    ===================================================== */

    function startLock() {

      isLocked = true;


      let seconds =
        LOCK_SECONDS;


      /*
        تعطيل كل العمليات
      */

      otpInput.disabled =
        true;


      verifyBtn.disabled =
        true;


      resendBtn.disabled =
        true;


      /*
        إظهار الرسالة
      */

      lockMessage.classList.add(
        "show"
      );


      showMessage(
        "تم إيقاف المحاولات مؤقتاً لحماية حسابك.",
        "error"
      );


      updateLockTime(
        seconds
      );


      clearInterval(
        lockTimer
      );


      lockTimer =
        setInterval(
          () => {

            seconds--;


            updateLockTime(
              seconds
            );


            if (
              seconds <= 0
            ) {

              clearInterval(
                lockTimer
              );


              isLocked = false;


              failedAttempts = 0;


              otpInput.disabled =
                false;


              verifyBtn.disabled =
                false;


              resendBtn.disabled =
                true;


              lockMessage.classList.remove(
                "show"
              );


              otpInput.value = "";


              otpInput.classList.remove(
                "error"
              );


              showMessage(
                "يمكنك المحاولة مرة أخرى الآن.",
                "info"
              );


              /*
                بعد انتهاء الـ5 دقائق
                يبدأ عداد إعادة الإرسال من جديد
              */

              startResendTimer();


              otpInput.focus();

            }

          },
          1000
        );

    }


    /* =====================================================
       Lock Time
    ===================================================== */

    function updateLockTime(
      totalSeconds
    ) {

      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const seconds =
        totalSeconds % 60;


      lockTime.textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

    }


    /* =====================================================
       Start Page Timer
    ===================================================== */

    /*
      يبدأ مباشرة عند دخول الصفحة:
      59 → 58 → 57 ... → 0
    */

    startResendTimer();


    /* =====================================================
       Initial Focus
    ===================================================== */

    setTimeout(
      () => {

        if (
          !isLocked &&
          email
        ) {

          otpInput.focus();

        }

      },
      400
    );


  </script>

</body>

</html>
