<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تغيير كلمة المرور | Zain Sales</title>

  <meta
    name="theme-color"
    content="#7139b7"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="apple-touch-icon"
    href="./assets/icons/apple-touch-icon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    /* ==================================================
       البطاقة
    ================================================== */

    .reset-card {
      width: min(92%, 430px);

      margin: 40px auto;

      background: #ffffff;

      border-radius: 24px;

      padding: 30px 24px;

      box-shadow:
        0 15px 45px
        rgba(0, 0, 0, 0.08);
    }


    /* ==================================================
       الشعار
    ================================================== */

    .reset-card .logo {
      width: 64px;

      height: 64px;

      margin: 0 auto 16px;

      border-radius: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #7139b7;

      color: #ffffff;

      font-size: 30px;

      font-weight: 800;
    }


    /* ==================================================
       العنوان
    ================================================== */

    .reset-card h1 {
      text-align: center;

      margin: 0;

      font-size: 24px;
    }


    .reset-card .subtitle {
      text-align: center;

      color: #777;

      margin: 8px 0 28px;

      line-height: 1.7;
    }


    /* ==================================================
       الحقول
    ================================================== */

    .password-group {
      margin-bottom: 18px;
    }


    .password-group label {
      display: block;

      margin-bottom: 8px;

      font-weight: 700;
    }


    /* ==================================================
       كلمة المرور
    ================================================== */

    .password-wrapper {
      position: relative;

      width: 100%;
    }


    .password-wrapper input {
      width: 100%;

      box-sizing: border-box;

      padding: 14px 15px;

      padding-left: 50px;

      border: 1px solid #ddd;

      border-radius: 12px;

      font-family: inherit;

      font-size: 15px;

      outline: none;

      background: #ffffff;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }


    .password-wrapper input:focus {
      border-color: #7139b7;

      box-shadow:
        0 0 0 3px
        rgba(113, 57, 183, 0.10);
    }


   
    /* ==================================================
       قوة كلمة المرور
    ================================================== */

    .password-strength {
      margin-top: 10px;
    }


    .strength-track {
      width: 100%;

      height: 6px;

      border-radius: 20px;

      background: #e9e9e9;

      overflow: hidden;
    }


    .strength-bar {
      width: 0;

      height: 100%;

      border-radius: 20px;

      background: #ddd;

      transition:
        width 0.25s ease,
        background 0.25s ease;
    }


    .strength-info {
      display: flex;

      justify-content: space-between;

      margin-top: 6px;

      font-size: 11px;
    }


    .strength-label {
      font-weight: 800;

      color: #999;
    }


    .strength-requirements {
      color: #999;
    }


    /* ==================================================
       شروط كلمة المرور
    ================================================== */

.password-rules {
      margin-top: 10px;

      padding: 11px 12px;

      border-radius: 12px;

      background: #fafafa;

      border: 1px solid #eeeeee;
    }


    .password-rule {
      display: flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 5px;

      color: #999;

      font-size: 11px;

      transition:
        color 0.2s ease;
    }


    .password-rule:last-child {
      margin-bottom: 0;
    }


    .password-rule-icon {
      width: 17px;

      height: 17px;

      flex: 0 0 17px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #e8e8e8;

      color: #999;

      font-size: 9px;

      font-weight: 900;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }


    .password-rule.valid {
      color: #27853b;
    }


    .password-rule.valid
    .password-rule-icon {
      background: #dff4e4;

      color: #27853b;
    }


    /* ==================================================
       تأكيد كلمة المرور
    ================================================== */

    .confirm-status {
      display: none;

      margin-top: 6px;

      font-size: 11px;

      font-weight: 700;
    }


    .confirm-status.show {
      display: block;
    }


    .confirm-status.match {
      color: #27853b;
    }


    .confirm-status.not-match {
      color: #c62828;
    }


    /* ==================================================
       الرسائل
    ================================================== */

    .reset-message {
      display: none;

      margin-top: 16px;

      padding: 13px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.7;
    }


    .reset-message.success {
      display: block;

      background: #ecfdf3;

      color: #137333;
    }


    .reset-message.error {
      display: block;

      background: #fff1f2;

      color: #c62828;
    }


    /* ==================================================
       زر الحفظ
    ================================================== */

    #resetBtn {
      width: 100%;

      margin-top: 8px;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: #7139b7;

      color: #ffffff;

      font-family: inherit;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease,
        opacity 0.2s ease,
        transform 0.1s ease;
    }


    #resetBtn:hover {
      background: #652fa8;
    }


    #resetBtn:active {
      transform: scale(0.99);
    }


    #resetBtn:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }


    /* ==================================================
       الرجوع لتسجيل الدخول
    ================================================== */

    .back-login {
      text-align: center;

      margin-top: 22px;
    }


    .back-login a {
      color: #7139b7;

      text-decoration: none;

      font-weight: 700;
    }


    .back-login a:hover {
      text-decoration: underline;
    }


    /* ==================================================
       حالة التحميل
    ================================================== */

    #resetForm {
      display: none;
    }


    #loadingMessage {
      text-align: center;

      color: #777;

      line-height: 1.8;

      padding: 10px 0;
    }


    /* ==================================================
       الموبايل
    ================================================== */

    @media (max-width: 480px) {

      .reset-card {
        width: calc(100% - 28px);

        margin: 20px auto;

        padding: 26px 18px;

        border-radius: 22px;
      }


      .reset-card h1 {
        font-size: 22px;
      }

    }

  </style>

</head>


<body class="login-page">


  <main class="reset-card">


    <!-- ==================================================
         الشعار
    ================================================== -->

    <div class="logo">
      Z
    </div>


    <!-- ==================================================
         العنوان
    ================================================== -->

    <h1>
      تغيير كلمة المرور
    </h1>


    <p class="subtitle">
      أدخل كلمة المرور الجديدة لحسابك.
    </p>


    <!-- ==================================================
         حالة التحقق
    ================================================== -->

    <div id="loadingMessage">
      جاري التحقق من رابط الاستعادة...
    </div>


    <!-- ==================================================
         فورم تغيير كلمة المرور
    ================================================== -->

    <form id="resetForm">


      <!-- ==================================================
           كلمة المرور الجديدة
      ================================================== -->

      <div class="password-group">

        <label for="newPassword">
          كلمة المرور الجديدة
        </label>


        <div class="password-wrapper">

          <input
            type="password"
            id="newPassword"
            placeholder="أدخل كلمة المرور الجديدة"
            autocomplete="new-password"
            required
          >
        </div>


        <!-- ==================================================
             قوة كلمة المرور
        ================================================== -->

        <div class="password-strength">

          <div class="strength-track">

            <div
              class="strength-bar"
              id="strengthBar"
            ></div>

          </div>


          <div class="strength-info">

            <span
              class="strength-label"
              id="strengthLabel"
            >
              قوة كلمة المرور
            </span>

            <span class="strength-requirements">
              4 شروط مطلوبة
            </span>

          </div>

        </div>


        <!-- ==================================================
             شروط كلمة المرور
        ================================================== -->

        <div class="password-rules">


          <div
            class="password-rule"
            id="ruleLength"
          >

            <span class="password-rule-icon">
              ✓
            </span>

            <span>
              6 أحرف على الأقل
            </span>

          </div>


          <div
            class="password-rule"
            id="ruleNumber"
          >

            <span class="password-rule-icon">
              ✓
            </span>

            <span>
              تحتوي على رقم
            </span>

          </div>


          <div
            class="password-rule"
            id="ruleUppercase"
          >

            <span class="password-rule-icon">
              ✓
            </span>

            <span>
              تحتوي على حرف إنجليزي كبير
            </span>

          </div>


          <div
            class="password-rule"
            id="ruleSpecial"
          >

            <span class="password-rule-icon">
              ✓
            </span>

            <span>
              تحتوي على رمز خاص
            </span>

          </div>


        </div>

      </div>


      <!-- ==================================================
           تأكيد كلمة المرور
      ================================================== -->

      <div class="password-group">

        <label for="confirmPassword">
          تأكيد كلمة المرور
        </label>


        <div class="password-wrapper">

          <input
            type="password"
            id="confirmPassword"
            placeholder="أعد كتابة كلمة المرور"
            autocomplete="new-password"
            required
          >
        </div>


        <div
          id="confirmStatus"
          class="confirm-status"
        ></div>

      </div>


      <!-- ==================================================
           الرسالة
      ================================================== -->

      <p
        id="resetMessage"
        class="reset-message"
        role="alert"
        aria-live="polite"
      ></p>


      <!-- ==================================================
           زر الحفظ
      ================================================== -->

      <button
        type="submit"
        id="resetBtn"
      >
        حفظ كلمة المرور الجديدة
      </button>


    </form>


    <!-- ==================================================
         العودة لتسجيل الدخول
    ================================================== -->

    <div class="back-login">

      <a href="index.html">
        العودة إلى تسجيل الدخول
      </a>

    </div>


  </main>


  <!-- ==================================================
       Supabase
  ================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
  ></script>


  <!-- ==================================================
       Config
  ================================================== -->

  <script src="js/config.js"></script>


  <!-- ==================================================
       Reset Password JS
  ================================================== -->

  <script src="js/reset-password.js"></script>


  <!-- ==================================================
       واجهة كلمة المرور
  ================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      () => {


        /* ==================================================
           العناصر
        ================================================== */

        const newPassword =
          document.getElementById(
            "newPassword"
          );


        const confirmPassword =
          document.getElementById(
            "confirmPassword"
          );


        const toggleNewPassword =
          document.getElementById(
            "toggleNewPassword"
          );


        const toggleConfirmPassword =
          document.getElementById(
            "toggleConfirmPassword"
          );


        const strengthBar =
          document.getElementById(
            "strengthBar"
          );


        const strengthLabel =
          document.getElementById(
            "strengthLabel"
          );


        const ruleLength =
          document.getElementById(
            "ruleLength"
          );


        const ruleNumber =
          document.getElementById(
            "ruleNumber"
          );


        const ruleUppercase =
          document.getElementById(
            "ruleUppercase"
          );


        const ruleSpecial =
          document.getElementById(
            "ruleSpecial"
          );


        const confirmStatus =
          document.getElementById(
            "confirmStatus"
          );


        /* ==================================================
           إظهار / إخفاء كلمة المرور
        ================================================== */

        function setupPasswordToggle(
          button,
          input
        ) {

          if (!button || !input) {
            return;
          }


          button.addEventListener(
            "click",
            () => {

              const isPassword =
                input.type === "password";


              input.type =
                isPassword
                  ? "text"
                  : "password";


              button.textContent =
                isPassword
                  ? "🙈"
                  : "👁";


              button.setAttribute(
                "aria-label",
                isPassword
                  ? "إخفاء كلمة المرور"
                  : "إظهار كلمة المرور"
              );

            }
          );

        }


        setupPasswordToggle(
          toggleNewPassword,
          newPassword
        );


        setupPasswordToggle(
          toggleConfirmPassword,
          confirmPassword
        );


        /* ==================================================
           فحص شروط كلمة المرور
        ================================================== */

        function updatePasswordStrength() {

          if (!newPassword) {
            return;
          }


          const password =
            newPassword.value;


          const checks = {

            length:
              password.length >= 6,

            number:
              /[0-9]/.test(password),

            uppercase:
              /[A-Z]/.test(password),

            special:
              /[^A-Za-z0-9]/.test(password)

          };


          updateRule(
            ruleLength,
            checks.length
          );


          updateRule(
            ruleNumber,
            checks.number
          );


          updateRule(
            ruleUppercase,
            checks.uppercase
          );


          updateRule(
            ruleSpecial,
            checks.special
          );


          const score =
            Object.values(checks)
              .filter(Boolean)
              .length;


          if (!password) {

            strengthBar.style.width =
              "0%";

            strengthBar.style.background =
              "#ddd";

            strengthLabel.textContent =
              "قوة كلمة المرور";

            strengthLabel.style.color =
              "#999";

            return;

          }


          if (score === 1) {

            strengthBar.style.width =
              "25%";

            strengthBar.style.background =
              "#c62828";

            strengthLabel.textContent =
              "ضعيفة";

            strengthLabel.style.color =
              "#c62828";

          } else if (score === 2) {

            strengthBar.style.width =
              "50%";

            strengthBar.style.background =
              "#e58f00";

            strengthLabel.textContent =
              "متوسطة";

            strengthLabel.style.color =
              "#e58f00";

          } else if (score === 3) {

            strengthBar.style.width =
              "75%";

            strengthBar.style.background =
              "#6c8f00";

            strengthLabel.textContent =
              "جيدة";

            strengthLabel.style.color =
              "#6c8f00";

          } else {

            strengthBar.style.width =
              "100%";

            strengthBar.style.background =
              "#27853b";

            strengthLabel.textContent =
              "قوية";

            strengthLabel.style.color =
              "#27853b";

          }

        }


        /* ==================================================
           تحديث شرط
        ================================================== */

        function updateRule(
          element,
          valid
        ) {

          if (!element) {
            return;
          }


          if (valid) {

            element.classList.add(
              "valid"
            );

          } else {

            element.classList.remove(
              "valid"
            );

          }

        }


        /* ==================================================
           مراقبة كلمة المرور
        ================================================== */

        if (newPassword) {

          newPassword.addEventListener(
            "input",
            () => {

              updatePasswordStrength();

              updateConfirmStatus();

            }
          );

        }


        /* ==================================================
           تطابق كلمة المرور
        ================================================== */

        function updateConfirmStatus() {

          if (
            !confirmPassword ||
            !confirmStatus
          ) {
            return;
          }


          const password =
            newPassword.value;


          const confirmation =
            confirmPassword.value;


          if (!confirmation) {

            confirmStatus.textContent =
              "";

            confirmStatus.className =
              "confirm-status";

            return;

          }


          if (
            password === confirmation
          ) {

            confirmStatus.textContent =
              "✓ كلمتا المرور متطابقتان";

            confirmStatus.className =
              "confirm-status show match";

          } else {

            confirmStatus.textContent =
              "✕ كلمتا المرور غير متطابقتين";

            confirmStatus.className =
              "confirm-status show not-match";

          }

        }


        if (confirmPassword) {

          confirmPassword.addEventListener(
            "input",
            updateConfirmStatus
          );

        }


        /* ==================================================
           تشغيل الحالة الأولية
        ================================================== */

        updatePasswordStrength();

        updateConfirmStatus();

      }
    );

  </script>


</body>

</html>
