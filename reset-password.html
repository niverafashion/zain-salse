<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تغيير كلمة المرور | Zain Sales</title>

  <meta
    name="theme-color"
    content="#7139b7"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="apple-touch-icon"
    href="./assets/icons/apple-touch-icon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    .reset-card {
      width: min(92%, 430px);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
    }

    .reset-card .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #7139b7;
      color: #ffffff;
      font-size: 30px;
      font-weight: 800;
    }

    .reset-card h1 {
      text-align: center;
      margin: 0;
      font-size: 24px;
    }

    .reset-card .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
      line-height: 1.7;
    }

    .reset-card label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .reset-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .reset-card input:focus {
      border-color: #7139b7;
      box-shadow: 0 0 0 3px rgba(113, 57, 183, 0.10);
    }

    .password-group {
      margin-bottom: 18px;
    }

    .rules {
      margin-top: 10px;
      font-size: 13px;
      color: #777;
      line-height: 1.8;
    }

    .rule {
      transition: 0.2s;
    }

    .rule.valid {
      color: #16803c;
    }

    .reset-card button {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #7139b7;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .reset-message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
    }

    .reset-message.success {
      display: block;
      background: #ecfdf3;
      color: #137333;
    }

    .reset-message.error {
      display: block;
      background: #fff1f2;
      color: #c62828;
    }

    .back-login {
      text-align: center;
      margin-top: 22px;
    }

    .back-login a {
      color: #7139b7;
      text-decoration: none;
      font-weight: 700;
    }

    #resetForm {
      display: none;
    }

    #loadingMessage {
      text-align: center;
      color: #777;
      line-height: 1.8;
    }

  </style>

</head>

<body class="login-page">

  <main class="reset-card">

    <div class="logo">
      Z
    </div>

    <h1>
      تغيير كلمة المرور
    </h1>

    <p class="subtitle">
      أدخل كلمة المرور الجديدة لحسابك.
    </p>


    <div id="loadingMessage">
      جاري التحقق من رابط الاستعادة...
    </div>


    <form id="resetForm">

      <div class="password-group">

        <label for="newPassword">
          كلمة المرور الجديدة
        </label>

        <input
          type="password"
          id="newPassword"
          placeholder="أدخل كلمة المرور الجديدة"
          autocomplete="new-password"
          required
        >

        <div class="rules">

          <div
            id="ruleLength"
            class="rule"
          >
            • 6 أحرف على الأقل
          </div>

          <div
            id="ruleNumber"
            class="rule"
          >
            • تحتوي على رقم
          </div>

          <div
            id="ruleUppercase"
            class="rule"
          >
            • تحتوي على حرف إنجليزي كبير
          </div>

          <div
            id="ruleSpecial"
            class="rule"
          >
            • تحتوي على رمز خاص
          </div>

        </div>

      </div>


      <div class="password-group">

        <label for="confirmPassword">
          تأكيد كلمة المرور
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="أعد كتابة كلمة المرور"
          autocomplete="new-password"
          required
        >

      </div>


      <p
        id="resetMessage"
        class="reset-message"
        role="alert"
        aria-live="polite"
      ></p>


      <button
        type="submit"
        id="resetBtn"
      >
        حفظ كلمة المرور الجديدة
      </button>

    </form>


    <div class="back-login">

      <a href="index.html">
        العودة إلى تسجيل الدخول
      </a>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script src="js/config.js"></script>

  <script src="js/reset-password.js"></script>

</body>

</html>
