<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>استعادة كلمة المرور | Zain Sales</title>

  <meta
    name="theme-color"
    content="#7139b7"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Zain Sales"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="apple-touch-icon"
    href="./assets/icons/apple-touch-icon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >


  <style>

    /* =====================================================
       Forgot Password
       ===================================================== */

    .forgot-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      box-sizing: border-box;
    }


    .forgot-card {
      width: min(100%, 430px);
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 24px;
      box-sizing: border-box;
      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.08);
    }


    /* =====================================================
       Logo
       ===================================================== */

    .forgot-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: #7139b7;
      color: #ffffff;

      font-size: 30px;
      font-weight: 800;

      box-shadow:
        0 8px 20px rgba(113, 57, 183, 0.20);
    }


    /* =====================================================
       العنوان
       ===================================================== */

    .forgot-card h1 {
      margin: 0;

      text-align: center;

      color: #262032;

      font-size: 24px;
      font-weight: 800;
      line-height: 1.5;
    }


    .forgot-subtitle {
      margin: 8px 0 28px;

      text-align: center;

      color: #77727f;

      font-size: 14px;
      line-height: 1.8;
    }


    /* =====================================================
       الخطوات
       ===================================================== */

    .forgot-step {
      display: none;
    }


    .forgot-step.active {
      display: block;
    }


    /* =====================================================
       Label
       ===================================================== */

    .forgot-card label {
      display: block;

      margin-bottom: 8px;

      color: #302a38;

      font-size: 14px;
      font-weight: 700;
    }


    /* =====================================================
       Email Input
       ===================================================== */

    .forgot-card input[type="email"] {

      width: 100%;
      height: 50px;

      padding: 0 15px;

      box-sizing: border-box;

      border: 1px solid #e0dce5;
      border-radius: 13px;

      background: #ffffff;

      color: #262032;

      font-family: inherit;
      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }


    .forgot-card input[type="email"]:focus {

      border-color: #7139b7;

      box-shadow:
        0 0 0 3px rgba(113, 57, 183, 0.10);
    }


    /* =====================================================
       OTP
       ===================================================== */

    .otp-input {

      width: 100%;
      height: 62px;

      box-sizing: border-box;

      padding: 0 12px;

      border: 1px solid #e0dce5;
      border-radius: 14px;

      background: #ffffff;

      color: #7139b7;

      font-family: inherit;

      font-size: 28px;
      font-weight: 800;

      letter-spacing: 10px;

      text-align: center;

      direction: ltr;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }


    .otp-input:focus {

      border-color: #7139b7;

      box-shadow:
        0 0 0 3px rgba(113, 57, 183, 0.10);
    }


    .otp-input::placeholder {

      color: #c9c4cf;

      letter-spacing: 8px;
    }


    /* =====================================================
       Email Display
       ===================================================== */

    .forgot-email {

      margin: 0 0 20px;

      text-align: center;

      color: #7139b7;

      font-size: 14px;
      font-weight: 700;

      direction: ltr;
    }


    /* =====================================================
       Description
       ===================================================== */

    .otp-description {

      margin: -4px 0 20px;

      text-align: center;

      color: #77727f;

      font-size: 13px;

      line-height: 1.8;
    }


    /* =====================================================
       Main Button
       ===================================================== */

    .forgot-card button[type="submit"] {

      width: 100%;

      height: 50px;

      margin-top: 18px;

      border: none;
      border-radius: 13px;

      background: #7139b7;

      color: #ffffff;

      font-family: inherit;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease,
        opacity 0.2s ease,
        transform 0.1s ease;
    }


    .forgot-card button[type="submit"]:active {

      transform: scale(0.99);
    }


    .forgot-card button[type="submit"]:hover {

      background: #6530aa;
    }


    .forgot-card button[type="submit"]:disabled {

      opacity: 0.6;

      cursor: not-allowed;
    }


    /* =====================================================
       Loading
       ===================================================== */

    .forgot-loading {

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;
    }


    .forgot-spinner {

      width: 17px;
      height: 17px;

      border: 2px solid rgba(255, 255, 255, 0.35);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        forgotSpin 0.7s linear infinite;
    }


    @keyframes forgotSpin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =====================================================
       Messages
       ===================================================== */

    .forgot-message {

      display: none;

      margin-top: 16px;

      padding: 12px 13px;

      border-radius: 12px;

      font-size: 13px;

      line-height: 1.8;

      text-align: center;
    }


    .forgot-message.show {
      display: block;
    }


    .forgot-message.success {

      background: #ecfdf3;

      color: #137333;
    }


    .forgot-message.error {

      background: #fff1f2;

      color: #c62828;
    }


    .forgot-message.info {

      background: #f4effb;

      color: #7139b7;
    }


    /* =====================================================
       Resend
       ===================================================== */

    .resend-wrapper {

      margin-top: 18px;

      text-align: center;
    }


    .resend-text {

      margin: 0 0 7px;

      color: #88818f;

      font-size: 13px;
    }


    .resend-btn {

      width: auto !important;

      height: auto !important;

      margin: 0 !important;

      padding: 0 !important;

      border: none !important;

      background: transparent !important;

      color: #7139b7 !important;

      font-family: inherit;

      font-size: 13px !important;

      font-weight: 700 !important;

      cursor: pointer;

      box-shadow: none !important;
    }


    .resend-btn:disabled {

      color: #aaa3af !important;

      cursor: not-allowed;
    }


    .resend-countdown {

      color: #7139b7;

      font-weight: 700;
    }


    /* =====================================================
       Lock Message
       ===================================================== */

    .forgot-lock {

      display: none;

      margin-top: 16px;

      padding: 12px;

      border-radius: 12px;

      background: #fff7ed;

      color: #9a5b13;

      font-size: 13px;

      line-height: 1.8;

      text-align: center;
    }


    .forgot-lock.show {
      display: block;
    }


    .forgot-lock-time {

      display: block;

      margin-top: 3px;

      font-size: 15px;

      font-weight: 800;
    }


    /* =====================================================
       Back Login
       ===================================================== */

    .back-login {

      margin-top: 24px;

      text-align: center;
    }


    .back-login a {

      color: #7139b7;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;
    }


    .back-login a:hover {

      text-decoration: underline;
    }


    /* =====================================================
       Mobile
       ===================================================== */

    @media (max-width: 480px) {

      .forgot-page {
        padding: 18px 14px;
      }


      .forgot-card {

        padding: 27px 20px;

        border-radius: 22px;
      }


      .forgot-card h1 {

        font-size: 22px;
      }


      .otp-input {

        height: 58px;

        font-size: 26px;

        letter-spacing: 8px;
      }

    }

  </style>

</head>


<body class="login-page">


  <main class="forgot-page">


    <section
      class="forgot-card"
      aria-label="استعادة كلمة المرور"
    >


      <!-- =================================================
           Logo
           ================================================= -->

      <div class="forgot-logo">
        Z
      </div>


      <!-- =================================================
           Title
           ================================================= -->

      <h1 id="forgotTitle">
        نسيت كلمة المرور؟
      </h1>


      <p
        class="forgot-subtitle"
        id="forgotSubtitle"
      >
        أدخل بريدك الإلكتروني وسنرسل لك رمز تحقق لإعادة تعيين كلمة المرور.
      </p>


      <!-- =================================================
           Step 1
           إدخال البريد
           ================================================= -->

      <div
        class="forgot-step active"
        id="emailStep"
      >


        <form id="forgotPasswordForm">


          <div class="form-group">


            <label for="email">
              البريد الإلكتروني
            </label>


            <input
              type="email"
              id="email"
              placeholder="أدخل بريدك الإلكتروني"
              autocomplete="email"
              inputmode="email"
              required
            >


          </div>


          <p
            id="message"
            class="forgot-message"
            role="alert"
            aria-live="polite"
          ></p>


          <button
            type="submit"
            id="sendResetBtn"
          >
            إرسال رمز التحقق
          </button>


        </form>


      </div>


      <!-- =================================================
           Step 2
           إدخال OTP
           ================================================= -->

      <div
        class="forgot-step"
        id="otpStep"
      >


        <p
          class="forgot-email"
          id="forgotEmail"
        ></p>


        <p class="otp-description">
          أدخل رمز التحقق المكوّن من 6 أرقام الذي أرسلناه إلى بريدك الإلكتروني.
        </p>


        <form id="verifyResetForm">


          <div class="form-group">


            <label for="resetOtp">
              رمز التحقق
            </label>


            <input
              type="text"
              id="resetOtp"
              class="otp-input"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              minlength="6"
              pattern="[0-9]{6}"
              placeholder="••••••"
              aria-label="رمز التحقق المكون من 6 أرقام"
            >


          </div>


          <p
            id="otpMessage"
            class="forgot-message"
            role="alert"
            aria-live="polite"
          ></p>


          <button
            type="submit"
            id="verifyResetBtn"
          >
            تأكيد الرمز
          </button>


        </form>


        <!-- =================================================
             Resend
             ================================================= -->

        <div class="resend-wrapper">


          <p class="resend-text">

            لم يصلك الرمز؟

            <span
              id="resendCountdown"
              class="resend-countdown"
            >
              59
            </span>

          </p>


          <button
            type="button"
            id="resendResetBtn"
            class="resend-btn"
            disabled
          >
            إعادة إرسال الرمز
          </button>


        </div>


        <!-- =================================================
             Lock
             ================================================= -->

        <div
          id="forgotLock"
          class="forgot-lock"
          role="alert"
          aria-live="polite"
        >

          تم إيقاف المحاولة مؤقتاً بسبب إدخال رمز غير صحيح عدة مرات.

          <span
            id="forgotLockTime"
            class="forgot-lock-time"
          >
            05:00
          </span>

        </div>


      </div>


      <!-- =================================================
           Back Login
           ================================================= -->

      <div class="back-login">

        <a href="index.html">
          العودة إلى تسجيل الدخول
        </a>

      </div>


    </section>


  </main>


  <!-- =====================================================
       Supabase
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
  ></script>


  <!-- =====================================================
       Config
       ===================================================== -->

  <script src="js/config.js"></script>


  <!-- =====================================================
       Forgot Password JS
       ===================================================== -->

  <script src="js/forgot-password.js"></script>


</body>

</html>
