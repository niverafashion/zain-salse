<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>استعادة كلمة المرور | Zain Sales</title>

  <meta
    name="theme-color"
    content="#7139b7"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="apple-touch-icon"
    href="./assets/icons/apple-touch-icon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    .forgot-card {
      width: min(92%, 430px);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
    }

    .forgot-card .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #7139b7;
      color: #ffffff;
      font-size: 30px;
      font-weight: 800;
    }

    .forgot-card h1 {
      text-align: center;
      margin: 0;
      font-size: 24px;
    }

    .forgot-card .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
      line-height: 1.7;
    }

    .forgot-card label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .forgot-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .forgot-card input:focus {
      border-color: #7139b7;
      box-shadow: 0 0 0 3px rgba(113, 57, 183, 0.10);
    }

    .forgot-card button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #7139b7;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .forgot-card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot-message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
    }

    .forgot-message.success {
      display: block;
      background: #ecfdf3;
      color: #137333;
    }

    .forgot-message.error {
      display: block;
      background: #fff1f2;
      color: #c62828;
    }

    .back-login {
      text-align: center;
      margin-top: 22px;
    }

    .back-login a {
      color: #7139b7;
      text-decoration: none;
      font-weight: 700;
    }

  </style>

</head>

<body class="login-page">

  <main class="forgot-card">

    <div class="logo">
      Z
    </div>

    <h1>
      نسيت كلمة المرور؟
    </h1>

    <p class="subtitle">
      أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.
    </p>

    <form id="forgotPasswordForm">

      <div class="form-group">

        <label for="email">
          البريد الإلكتروني
        </label>

        <input
          type="email"
          id="email"
          placeholder="أدخل بريدك الإلكتروني"
          autocomplete="email"
          required
        >

      </div>

      <p
        id="message"
        class="forgot-message"
        role="alert"
        aria-live="polite"
      ></p>

      <button
        type="submit"
        id="sendResetBtn"
      >
        إرسال رابط الاستعادة
      </button>

    </form>

    <div class="back-login">

      <a href="index.html">
        العودة إلى تسجيل الدخول
      </a>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script src="js/config.js"></script>

  <script src="js/forgot-password.js"></script>

</body>

</html>
